<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>REPS v2 — prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,600;1,700;1,800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F5F3EE;--cream2:#EDEAE3;--cream3:#E0DDD6;--white:#FFFFFF;
  --ink:#221F20;--ink2:#4A4740;--ink3:#8A877F;--ink4:#C4C1BA;
  --accent:#0000F5;--accent-l:#E6E6FF;
  --lime:#D2FC51;--lime-l:#F2FECC;
  --green:#1A7A4A;--green-l:#E8F5EE;
  --amber:#C4640A;--amber-l:#FEF3E7;
  --red:#C42A2A;--red-l:#FDEEE8;
  --purple:#6B3FA0;--purple-l:#F3EDFC;
  --sh-sm:0 1px 3px rgba(34,31,32,.06),0 1px 2px rgba(34,31,32,.04);
  --sh:0 4px 12px rgba(34,31,32,.08),0 1px 3px rgba(34,31,32,.05);
  --r:16px;--rs:10px;--rx:20px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--cream);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
.phone{max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:92px;}
.proto{background:var(--purple-l);color:var(--purple);font-size:11px;font-weight:700;padding:7px 16px;text-align:center;}
.hdr{padding:max(12px,env(safe-area-inset-top)) 20px 12px;display:flex;align-items:center;justify-content:space-between;position:relative;}
.hdr::after{content:'';position:absolute;bottom:0;left:20px;right:20px;height:1px;background:var(--cream3);}
.logo{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-size:24px;font-weight:800;}
.logo span{color:var(--accent);}
.wkb{font-size:10.5px;font-weight:700;color:var(--ink3);background:var(--cream2);padding:5px 11px;border-radius:20px;text-transform:uppercase;}
.ctxbar{padding:14px 16px 4px;}
.ctxlabel{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);margin-bottom:8px;display:flex;justify-content:space-between;}
.ctxlabel .hint{text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink4);}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;background:var(--white);border:1.5px solid var(--cream3);border-radius:20px;padding:8px 14px;font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer;font-family:inherit;}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.page{display:none;padding:12px 16px 20px;}
.page.active{display:block;animation:fadeUp .18s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--white);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--sh-sm);}
.card-lg{background:var(--white);border-radius:var(--rx);padding:20px;margin-bottom:10px;box-shadow:var(--sh);}
.chd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;gap:10px;}
.ctitle{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);}
.big{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-size:26px;font-weight:800;line-height:1.1;}
.sub{font-size:12px;color:var(--ink3);margin-top:3px;line-height:1.5;}
.divider{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink4);margin:18px 0 8px;}
.ex{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--cream2);}
.ex:first-of-type{border-top:none;}
.ex-pat{flex-shrink:0;width:30px;height:30px;border-radius:9px;background:var(--cream2);display:flex;align-items:center;justify-content:center;font-size:14px;}
.ex-body{min-width:0;flex:1;}
.ex-name{font-size:14px;font-weight:600;line-height:1.3;}
.ex-scheme{font-size:11px;color:var(--accent);font-weight:700;margin-top:2px;}
.ex-note{font-size:11px;color:var(--ink3);margin-top:4px;line-height:1.5;}
.ex-swap{font-size:10px;color:var(--ink4);margin-top:3px;font-weight:600;}
/* inline progression */
.prog{display:flex;align-items:center;gap:7px;margin-top:5px;background:var(--cream);border-radius:7px;padding:5px 8px;}
.prog-v{font-size:11px;font-weight:700;color:var(--ink2);white-space:nowrap;}
.prog-d{font-size:10.5px;font-weight:700;white-space:nowrap;}
.up{color:var(--green);} .down{color:var(--red);} .flat{color:var(--ink4);}
.tagmini{display:inline-block;font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;text-transform:uppercase;vertical-align:1px;}
.t-same{background:var(--green-l);color:var(--green);}
.t-close{background:var(--amber-l);color:var(--amber);}
.t-min{background:var(--purple-l);color:var(--purple);}
.t-anchor{background:var(--ink);color:#fff;}
.fin{background:var(--lime-l);border-radius:var(--rs);padding:13px;margin-top:14px;}
.fin-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
.fin-kind{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-size:19px;font-weight:800;}
.fin-dur{font-size:10px;font-weight:700;color:var(--ink3);background:var(--white);padding:3px 9px;border-radius:20px;}
.fin-body{font-size:12px;color:var(--ink2);line-height:1.65;}
.fin-why{font-size:10.5px;color:var(--ink3);margin-top:7px;padding-top:7px;border-top:1px solid rgba(34,31,32,.08);line-height:1.5;}
.blk{display:flex;gap:9px;align-items:center;background:var(--white);border-radius:var(--r);padding:13px 15px;margin-bottom:10px;box-shadow:var(--sh-sm);}
.blk-dots{display:flex;gap:4px;flex-shrink:0;}
.dot{width:9px;height:9px;border-radius:50%;background:var(--cream3);}
.dot.on{background:var(--ink);} .dot.de{background:var(--amber);}
/* week rows */
.wk{display:flex;flex-direction:column;gap:7px;}
.wd{background:var(--white);border-radius:var(--r);padding:11px 12px;box-shadow:var(--sh-sm);display:flex;align-items:center;gap:10px;border:1.5px solid transparent;}
.wd.today{border-color:var(--accent);}
.wd.conflict{border-color:var(--amber);}
.wd-day{flex-shrink:0;width:34px;text-align:center;}
.wd-dow{font-size:10px;font-weight:700;color:var(--ink4);text-transform:uppercase;}
.wd-num{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-size:19px;font-weight:700;line-height:1;}
.wd-body{flex:1;min-width:0;}
.wd-title{font-size:13px;font-weight:600;line-height:1.3;}
.wd-meta{font-size:10.5px;color:var(--ink3);margin-top:2px;}
.wd-ctx{flex-shrink:0;font-size:9px;font-weight:700;padding:3px 7px;border-radius:5px;text-transform:uppercase;white-space:nowrap;}
.wd-grip{flex-shrink:0;width:30px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--ink4);cursor:pointer;border-radius:8px;background:var(--cream);}
.moved{background:var(--amber-l);color:var(--amber);font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;}
.core{background:var(--ink);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;}
.pin{background:var(--accent-l);color:var(--accent);font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;}
/* action sheet — lives OUTSIDE any scroll container */
.sheet{position:fixed;inset:0;z-index:400;display:none;align-items:flex-end;}
.sheet.open{display:flex;}
.sheet-bg{position:absolute;inset:0;background:rgba(26,24,20,.5);backdrop-filter:blur(4px);}
.sheet-p{position:relative;background:var(--cream);border-radius:24px 24px 0 0;width:100%;max-width:430px;margin:0 auto;max-height:88vh;overflow-y:auto;padding:18px 18px max(26px,env(safe-area-inset-bottom));box-shadow:0 -8px 40px rgba(26,24,20,.18);}
.sheet-grab{width:40px;height:4px;background:var(--cream3);border-radius:2px;margin:0 auto 15px;}
.sheet-t{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-size:22px;font-weight:800;}
.sheet-s{font-size:12px;color:var(--ink3);margin-top:2px;margin-bottom:16px;line-height:1.5;}
.act{width:100%;background:var(--white);border:none;border-radius:var(--r);padding:14px 15px;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);text-align:left;cursor:pointer;margin-bottom:8px;box-shadow:var(--sh-sm);display:flex;align-items:center;gap:11px;}
.act .ai{width:22px;text-align:center;font-size:15px;flex-shrink:0;}
.act small{display:block;font-size:11px;font-weight:600;color:var(--ink3);margin-top:1px;}
.act.danger{color:var(--red);}
.daygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px;}
.dbtn{background:var(--white);border:1.5px solid var(--cream3);border-radius:var(--rs);padding:9px 4px;font-family:inherit;cursor:pointer;text-align:center;}
.dbtn:disabled{opacity:.35;}
.dbtn .dd{font-size:10px;font-weight:700;color:var(--ink4);text-transform:uppercase;}
.dbtn .dn{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-size:17px;font-weight:700;}
.dbtn .dx{font-size:8.5px;font-weight:700;margin-top:2px;}
/* trip */
.seg{background:var(--white);border-radius:var(--r);padding:14px;margin-bottom:9px;box-shadow:var(--sh-sm);border-left:4px solid var(--cream3);}
.seg.now{border-left-color:var(--accent);}
.seg-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:5px;}
.seg-place{font-size:15px;font-weight:700;}
.seg-when{font-size:11px;color:var(--ink3);font-weight:600;}
.seg-focus{font-size:11.5px;color:var(--ink2);line-height:1.55;margin-top:7px;padding-top:8px;border-top:1px solid var(--cream2);}
.seg-badge{font-size:9px;font-weight:700;padding:3px 8px;border-radius:5px;text-transform:uppercase;white-space:nowrap;}
.phase{border-radius:var(--r);padding:14px;margin-bottom:10px;}
.phase-l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;opacity:.75;}
.phase-n{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-size:22px;font-weight:800;margin-top:2px;}
.phase-d{font-size:11.5px;line-height:1.55;margin-top:5px;opacity:.9;}
/* numbers */
.mrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--cream2);}
.mrow:first-of-type{border-top:none;}
.m-l{flex:1;min-width:0;}
.m-n{font-size:13px;font-weight:600;}
.m-s{font-size:10.5px;color:var(--ink4);margin-top:1px;}
.m-v{text-align:right;flex-shrink:0;}
.m-val{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-size:20px;font-weight:700;line-height:1;}
.m-val.dim{color:var(--ink4);}
.m-d{font-size:10px;font-weight:700;margin-top:2px;}
.stale{background:var(--amber-l);border-radius:var(--rs);padding:11px 13px;font-size:11.5px;color:var(--amber);line-height:1.55;font-weight:600;}
.strip{display:flex;gap:8px;margin-bottom:10px;}
.st{flex:1;background:var(--white);border-radius:var(--r);padding:11px 10px;box-shadow:var(--sh-sm);min-width:0;}
.st-l{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink4);}
.st-v{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-size:19px;font-weight:700;line-height:1.1;margin-top:2px;}
.st-d{font-size:9.5px;font-weight:700;}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(245,243,238,.95);backdrop-filter:blur(20px);border-top:1px solid var(--cream3);display:flex;padding-bottom:max(8px,env(safe-area-inset-bottom));z-index:100;}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 6px;cursor:pointer;color:var(--ink4);font-size:9.5px;font-weight:700;text-transform:uppercase;border:none;background:none;font-family:inherit;}
.ni.active{color:var(--accent);}
.ni svg{width:21px;height:21px;}
.btn{width:100%;padding:13px;border-radius:var(--r);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;border:none;background:var(--ink);color:#fff;}
.btn-g{background:transparent;border:1.5px solid var(--cream3);color:var(--ink2);}
.note{background:var(--accent-l);border-radius:var(--rs);padding:11px 13px;font-size:11.5px;color:var(--accent);line-height:1.55;font-weight:600;margin-bottom:12px;}
.warn{background:var(--amber-l);border-radius:var(--rs);padding:11px 13px;font-size:11.5px;color:var(--amber);line-height:1.55;font-weight:600;margin-bottom:12px;}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:11px 18px;border-radius:30px;opacity:0;transition:all .22s;z-index:500;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="phone">
<div class="proto">PROTOTYPE — demo data, not your real training log</div>
<div class="hdr"><div class="logo">REPS<span>.</span></div><div class="wkb" id="wkb">—</div></div>
<div class="ctxbar">
  <div class="ctxlabel"><span>Today I have access to</span><span class="hint">tap to switch →</span></div>
  <div class="chips" id="ctxChips"></div>
</div>
<div class="page active" id="pg-today"></div>
<div class="page" id="pg-week"></div>
<div class="page" id="pg-trip"></div>
<div class="page" id="pg-bench"></div>
<div class="nav">
  <button class="ni active" onclick="nav('today',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>Today</button>
  <button class="ni" onclick="nav('week',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Week</button>
  <button class="ni" onclick="nav('trip',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>Trip</button>
  <button class="ni" onclick="nav('bench',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Progress</button>
</div>
</div>

<!-- ACTION SHEET — outside everything, fixed positioning -->
<div class="sheet" id="sheet">
  <div class="sheet-bg" onclick="closeSheet()"></div>
  <div class="sheet-p" id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════════════
// REPS v2 PROTOTYPE
//  - programme written in MOVEMENT PATTERNS, resolved per CONTEXT
//  - two CORE full-body sessions, conditioning built in as finishers
//  - 3 load weeks + 1 deload; block TYPE set by equipment on that leg
//  - sessions MOVE, never vanish: tap any day to move/swap/push
//  - progression shown inline on every session, lifts AND running
// ══════════════════════════════════════════════════════════════════

const CONTEXTS = {
  full_gym:    {label:'Full gym',  short:'Full gym', icon:'🏋️', color:'var(--green)',  bg:'var(--green-l)',  strength:'full',    aerobic:'run', block:'BUILD'},
  limited_gym: {label:'Hotel gym', short:'Limited',  icon:'🏨', color:'var(--accent)', bg:'var(--accent-l)', strength:'limited', aerobic:'run', block:'DENSITY'},
  minimal:     {label:'Bands / bodyweight', short:'Minimal', icon:'🎒', color:'var(--purple)', bg:'var(--purple-l)', strength:'minimal', aerobic:'run', block:'HOLD'},
  travel:      {label:'Travel / hiking', short:'Travel', icon:'🥾', color:'var(--amber)', bg:'var(--amber-l)', strength:'none', aerobic:'hike', block:'ABSORB'}
};
const CTX_ORDER = ['full_gym','limited_gym','minimal','travel'];
const BLOCK_TYPES = {
  BUILD:{label:'Build block', desc:'Real gym. Heaviest loading available — push the four anchors while you can.'},
  DENSITY:{label:'Density block', desc:'Limited kit. Load drops, density rises: complexes, shorter rests, higher reps.'},
  HOLD:{label:'Hold block', desc:'Maintenance dose. Two hard sessions protect your size; expect max strength to drift a little.'},
  ABSORB:{label:'Absorb block', desc:'The trip is the training. Nothing planned. Walk, carry your pack, sleep.'}
};
const ANCHORS = ['squat','hinge','push','pull'];

const PATTERNS = {
  squat:{icon:'🦵',label:'Squat',
    full_gym:{name:'Back squat',match:'same',note:'High bar. Two light sets, then work.'},
    limited_gym:{name:'Goblet squat',match:'same',note:'Heaviest DB there is. 3-sec descent.'},
    minimal:{name:'Bulgarian split squat',match:'close',note:'Back foot on a bed. Harder than it looks.'},
    travel:{name:'Loaded hiking',match:'min',note:'Hills with a pack. That is squat volume.'}},
  hinge:{icon:'🪝',label:'Hinge',
    full_gym:{name:'Romanian deadlift',match:'same',note:'Bar close, 3-sec lowering.'},
    limited_gym:{name:'Dumbbell RDL',match:'same',note:'Same pattern. Push tempo, not load.'},
    minimal:{name:'Single-leg RDL',match:'close',note:'Bodyweight or a full water bottle.'},
    travel:{name:'Hip hinge mobility',match:'min',note:'Two minutes keeps the pattern alive.'}},
  push:{icon:'🙌',label:'Push',
    full_gym:{name:'Bench press',match:'same',note:'Arch, leg drive, touch chest, drive.'},
    limited_gym:{name:'Incline DB press',match:'same',note:'30–45°. Controlled descent.'},
    minimal:{name:'Push-up — feet elevated',match:'close',note:'Feet on a bed. Pause at the bottom.'},
    travel:{name:'Push-ups, any set',match:'min',note:'Hostel floor. Maintenance.'}},
  pull:{icon:'🪢',label:'Pull',
    full_gym:{name:'Weighted pull-up',match:'same',note:'Full hang to chin over.'},
    limited_gym:{name:'Chest-supported DB row',match:'same',note:'Squeeze one second at the top.'},
    minimal:{name:'Band row / towel row',match:'close',note:'Band round a post or towel in a door.'},
    travel:{name:'Backpack row',match:'min',note:'Loaded pack, hinge, row to ribs.'}},
  single_leg:{icon:'🦶',label:'Single leg',
    full_gym:{name:'Walking lunge',match:'same',note:'Moderate DBs, full hip extension.'},
    limited_gym:{name:'Reverse lunge',match:'same',note:'Pause one second at the bottom.'},
    minimal:{name:'Step-up',match:'close',note:'Any kerb or stair. Slow.'},
    travel:{name:'Stairs',match:'min',note:'Two at a time and it counts.'}}
};
const SCHEMES = {
  heavy:{full_gym:'4 × 4–6 @ RPE 8',limited_gym:'4 × 6–8 @ RPE 8',minimal:'4 × 8–10 slow',travel:'—'},
  volume:{full_gym:'3 × 8–12 @ RPE 9',limited_gym:'3 × 10–12 @ RPE 9',minimal:'3 × 15–20',travel:'—'},
  complex:{full_gym:'5 rounds × 6',limited_gym:'5 rounds × 6',minimal:'4 rounds × 10',travel:'—'}
};
const FINISHERS = {
  emom:{kind:'EMOM',dur:'12 min',
    why:'EMOM forces pacing, so form holds under fatigue. Lower metabolic cost than AMRAP — which is why it follows the heavy day.',
    full_gym:'Min 1 — 8 kettlebell swings<br>Min 2 — 10 push press<br>Min 3 — 12 goblet squats<br>Repeat ×4',
    limited_gym:'Min 1 — 10 DB snatch<br>Min 2 — 10 DB thruster<br>Min 3 — 12 DB swing<br>Repeat ×4',
    minimal:'Min 1 — 12 push-ups<br>Min 2 — 15 air squats<br>Min 3 — 8 burpees<br>Repeat ×4',
    travel:'Skip. Walk instead.'},
  amrap:{kind:'AMRAP',dur:'10 min',
    why:'AMRAP drives higher lactate and a bigger VO2 response than EMOM. Hardest thing in the week, and it follows the volume day on purpose.',
    full_gym:'As many rounds as possible:<br>10 cal row · 8 DB thruster · 10 pull-ups',
    limited_gym:'As many rounds as possible:<br>10 DB thruster · 10 renegade row · 15 air squat',
    minimal:'As many rounds as possible:<br>10 burpees · 15 air squats · 10 push-ups',
    travel:'Skip. Walk instead.'},
  rft:{kind:'Complex',dur:'5 rounds',
    why:'One implement, no rack, fifteen minutes, all four patterns. The format that travels.',
    full_gym:'Barbell complex, 6 reps each, unbroken:<br>RDL → bent row → hang clean → front squat → push press → lunge',
    limited_gym:'DB complex, 6 reps each, unbroken:<br>RDL → row → hang clean → front squat → push press → lunge',
    minimal:'Band complex, 10 reps each:<br>Good morning → row → curl → squat → press → lunge',
    travel:'Skip. Walk instead.'}
};
const SESSIONS = {
  heavy:{id:'heavy',label:'Heavy full body',kind:'strength',core:true,scheme:'heavy',
    patterns:['squat','push','pull','hinge'],finisher:'emom',priority:1,
    blurb:'Must happen. Four anchors, low reps, high intent.'},
  volume:{id:'volume',label:'Volume full body',kind:'strength',core:true,scheme:'volume',
    patterns:['hinge','pull','push','single_leg'],finisher:'amrap',priority:2,
    blurb:'Second non-negotiable. More reps, closer to failure.'},
  complex:{id:'complex',label:'Complex day',kind:'strength',core:false,scheme:'complex',
    patterns:['squat','hinge','push','pull'],finisher:'rft',priority:3,

// ══ SCHEDULER — pins win, the rest auto-place and slide forward ══
function canHold(id,ctxId){const s=SESSIONS[id],c=CONTEXTS[ctxId];
  if(s.kind==='strength')return c.strength!=='none';
  if(s.kind==='run')return c.aerobic==='run';
  return true;}
function schedule(){
  const slots=DAY_CTX.map(()=>null),unplaced=[];
  const pinnedIds=new Set();
  Object.keys(PINS).forEach(k=>{const i=+k,id=PINS[k];
    if(id&&SESSIONS[id]){slots[i]={id,pinned:true,slid:false};pinnedIds.add(id);}});
  const ideal={};WEEK_PLAN.forEach((id,i)=>ideal[id]=i);
  const order=WEEK_PLAN.filter(id=>!pinnedIds.has(id)).sort((a,b)=>SESSIONS[a].priority-SESSIONS[b].priority);
  order.forEach(id=>{let placed=false;
    for(let step=0;step<DAY_CTX.length&&!placed;step++){const i=ideal[id]+step;
      if(i>=DAY_CTX.length)break;
      if(!slots[i]&&canHold(id,DAY_CTX[i])){slots[i]={id,slid:step!==0,from:ideal[id]};placed=true;}}
    for(let i=0;i<DAY_CTX.length&&!placed;i++){
      if(!slots[i]&&canHold(id,DAY_CTX[i])){slots[i]={id,slid:true,from:ideal[id]};placed=true;}}
    if(!placed)unplaced.push(id);});
  return {slots,unplaced};
}
// Freeze the current auto-schedule into pins, so manual edits are predictable
function snapshot(){if(MANUAL)return;const {slots}=schedule();PINS={};
  slots.forEach((s,i)=>{if(s)PINS[i]=s.id;});MANUAL=true;}

function moveSession(from,to){snapshot();
  const a=PINS[from]||null,b=PINS[to]||null;
  if(b){PINS[from]=b;}else{delete PINS[from];}
  PINS[to]=a;renderAll();
  toast(b?'Swapped '+DOW[from]+' and '+DOW[to]:SESSIONS[a].label+' → '+DOW[to]);}
function pushSession(i){snapshot();const id=PINS[i];if(!id)return;
  for(let step=1;step<7;step++){const t=(i+step)%7;
    if(!PINS[t]&&canHold(id,DAY_CTX[t])){delete PINS[i];PINS[t]=id;renderAll();
      toast(SESSIONS[id].label+' pushed to '+DOW[t]);return;}}
  toast('No free day that can hold it');}
function clearDay(i){snapshot();delete PINS[i];renderAll();toast(DOW[i]+' cleared');}
function resetWeek(){PINS={};MANUAL=false;renderAll();toast('Back to automatic');}
function setDayCtx(i,k){DAY_CTX[i]=k;if(i===TODAY_IDX)CTX=k;renderAll();
  toast(DOW[i]+' → '+CONTEXTS[k].label);}

// ══ SPARKLINE — inline SVG, no libraries ══
function spark(vals,w,h,invert,col){
  if(vals.length<2)return '';
  const mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1;
  const pts=vals.map((v,i)=>{const x=(i/(vals.length-1))*(w-4)+2;
    let t=(v-mn)/rg;if(invert)t=1-t;const y=h-2-t*(h-4);return x.toFixed(1)+','+y.toFixed(1);});
  const last=pts[pts.length-1].split(',');
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="display:block;overflow:visible;">'+
    '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="2.6" fill="'+col+'"/></svg>';
}
function delta(cur,prev,unit,lowerBetter){
  const d=cur-prev;const good=lowerBetter?d<0:d>0;
  const cls=d===0?'flat':good?'up':'down';
  const arrow=d===0?'·':good?'▲':'▼';
  let txt;
  if(unit==='pace')txt=(d>0?'+':'−')+Math.abs(Math.round(d))+'s';
  else txt=(d>0?'+':d<0?'−':'')+Math.abs(d).toFixed(unit==='km'?1:1).replace(/\.0$/,'')+(unit||'');
  return '<span class="prog-d '+cls+'">'+arrow+' '+txt+'</span>';
}

        '<div class="phase-n">'+esc(p.label)+'</div><div class="phase-d">'+esc(p.desc)+'</div></div>';}).join('')+
    '<div class="divider">Legs</div>'+
    TRIP.map(seg=>{const c=CONTEXTS[seg.ctx],f=parseD(seg.from),t=parseD(seg.to);
      const now=TODAY>=f&&TODAY<=t,wks=Math.round((t-f)/(7*864e5));
      return '<div class="seg'+(now?' now':'')+'"><div class="seg-top"><div style="min-width:0;">'+
        '<div class="seg-place">'+esc(seg.place)+(now?' <span class="pin">now</span>':'')+'</div>'+
        '<div class="seg-when">'+f.getDate()+' '+MONTHS[f.getMonth()]+' – '+t.getDate()+' '+MONTHS[t.getMonth()]+' · '+wks+' wks · '+BLOCK_TYPES[c.block].label+'</div></div>'+
        '<div class="seg-badge" style="background:'+c.bg+';color:'+c.color+';">'+c.icon+' '+esc(c.short)+'</div></div>'+
        '<div class="seg-focus">'+esc(seg.focus)+'</div></div>';}).join('')+
    '<button class="btn btn-g" style="margin-top:6px;">+ Add a leg</button>';
}
function monthsSince(ds){if(!ds)return null;return Math.floor((TODAY-parseD(ds))/(30.44*864e5));}
function renderBench(){
  // lifts
  const lifts=ANCHORS.map(k=>{const L=LIFT_LOG[k],pts=L.pts.map(p=>p.v);
    const cur=pts[pts.length-1],first=pts[0];
    return '<div class="mrow"><div style="flex-shrink:0;">'+spark(pts,56,26,false,'var(--green)')+'</div>'+
      '<div class="m-l"><div class="m-n">'+esc(L.name)+'</div>'+
      '<div class="m-s">6 weeks · est. 1RM</div></div>'+
      '<div class="m-v"><div class="m-val">'+cur+'kg</div><div class="m-d">'+delta(cur,first,'kg')+'</div></div></div>';}).join('');
  // running
  const km=RUN_LOG.map(r=>r.km),pc=RUN_LOG.map(r=>r.pace);
  const runs='<div class="mrow"><div style="flex-shrink:0;">'+spark(km,56,26,false,'var(--accent)')+'</div>'+
    '<div class="m-l"><div class="m-n">Weekly volume</div><div class="m-s">6 weeks</div></div>'+
    '<div class="m-v"><div class="m-val">'+km[km.length-1]+'km</div><div class="m-d">'+delta(km[km.length-1],km[0],'km')+'</div></div></div>'+
    '<div class="mrow"><div style="flex-shrink:0;">'+spark(pc,56,26,true,'var(--accent)')+'</div>'+
    '<div class="m-l"><div class="m-n">Average pace</div><div class="m-s">Lower is better</div></div>'+
    '<div class="m-v"><div class="m-val">'+paceStr(pc[pc.length-1])+'</div><div class="m-d">'+delta(pc[pc.length-1],pc[0],'pace',true)+'</div></div></div>';
  // benchmark
  const bn=BENCH_LOG.map(b=>b.v);
  const bench='<div class="mrow"><div style="flex-shrink:0;">'+spark(bn,56,26,false,'var(--purple)')+'</div>'+
    '<div class="m-l"><div class="m-n">12-min AMRAP</div><div class="m-s">10 push-ups · 15 air squats · 10 burpees</div></div>'+
    '<div class="m-v"><div class="m-val">'+bn[bn.length-1].toFixed(1)+'</div><div class="m-d">'+delta(bn[bn.length-1],bn[0],' rds')+'</div></div></div>';
  // erg
  const ergRows=Object.keys(ERG_PRS).map(k=>{const p=ERG_PRS[k],m=monthsSince(p.logged),st=m!==null&&m>=2;
    return '<div class="mrow"><div class="m-l"><div class="m-n">'+esc(p.label)+'</div>'+
      '<div class="m-s">'+(p.val===null?'Never tested':st?'Set '+m+' months ago — kept as history':'Set '+m+' month'+(m===1?'':'s')+' ago')+'</div></div>'+
      '<div class="m-v"><div class="m-val'+(p.val===null||st?' dim':'')+'">'+esc(p.val||'—')+'</div></div></div>';}).join('');
  const anyStale=Object.keys(ERG_PRS).some(k=>{const m=monthsSince(ERG_PRS[k].logged);return m!==null&&m>=2;});

  document.getElementById('pg-bench').innerHTML=
    '<div class="card-lg"><div class="chd"><div><div class="ctitle">Strength — the four anchors</div>'+
      '<div class="sub">Fixed for the whole trip, so the trend means something. Everything else rotates.</div></div></div>'+lifts+'</div>'+
    '<div class="card-lg"><div class="chd"><div><div class="ctitle">Running</div>'+
      '<div class="sub">Volume and pace, week by week</div></div></div>'+runs+'</div>'+
    '<div class="card-lg"><div class="chd"><div><div class="ctitle">Travel-proof benchmark</div>'+
      '<div class="sub">Re-tested every block · needs no equipment</div></div></div>'+bench+
      '<div class="ex-note" style="margin-top:8px;">The one fitness number that stays comparable in a Mexico City gym and a Costa Rican beach hut.</div></div>'+
    '<div class="card-lg"><div class="chd"><div><div class="ctitle">Erg benchmarks</div>'+
      '<div class="sub">Rower and ski erg</div></div></div>'+
      (anyStale?'<div class="stale" style="margin-bottom:12px;">More than two months old. Without a rower these are kept as history — split targets are paused rather than driven by numbers that no longer describe you.</div>':'')+
      ergRows+'</div>';
}
function nav(pg,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('pg-'+pg).classList.add('active');
  document.querySelectorAll('.ni').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');window.scrollTo(0,0);
}
function renderAll(){
  const seg=currentSeg();
  document.getElementById('wkb').textContent='Block wk '+blockWeek()+' · '+(seg?seg.place:'Travelling');
  renderChips();renderToday();renderWeek();renderTrip();renderBench();
}
CTX=DAY_CTX[TODAY_IDX];
renderAll();
</script>
</body>
