// ══ PROGRESS DETAIL ══
// Single-series line chart: 2px line, visible markers, faint min/max guides,
// tap a point to read it (the phone version of a hover tooltip).
let CHART=null, PROG_NAMES=[], ENTRIES=[];
function lineChart(pts,col,unit,mark){
  if(pts.length<2)return '';
  const W=320,H=150,L=50,R=10,T=12,B=22;
  const vs=pts.map(p=>p.v), mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs);
  const pad=(mx-mn)*0.18||Math.max(1,mx*0.05), lo=mn-pad, hi=mx+pad;
  const ts=pts.map(p=>parseD(p.d).getTime()), t0=ts[0], span=(ts[ts.length-1]-t0)||1;
  const X=i=>L+(ts[i]-t0)/span*(W-L-R), Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  CHART={pts:pts,unit:unit,xy:pts.map((p,i)=>[X(i),Y(p.v)])};
  // labels live in their own left gutter, so the line can never run through them
  const guide=(v,lab)=>'<line x1="'+(L-6)+'" x2="'+W+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--cream3)" stroke-width="1" stroke-dasharray="3 3"/>'+
    '<text x="'+(L-10)+'" y="'+(Y(v)+3).toFixed(1)+'" font-size="9" font-weight="700" fill="var(--ink3)" text-anchor="end">'+lab+'</text>';
  const first=parseD(pts[0].d), last=parseD(pts[pts.length-1].d);
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;overflow:visible;touch-action:manipulation;">'+
    guide(mx,mx+unit)+(mn!==mx?guide(mn,mn+unit):'')+
    (mark&&parseD(mark.d).getTime()>t0&&parseD(mark.d).getTime()<=ts[ts.length-1]?(function(){ const x=(L+(parseD(mark.d).getTime()-t0)/span*(W-L-R)).toFixed(1);
      return '<line x1="'+x+'" x2="'+x+'" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 3"/>'+
        '<text x="'+x+'" y="'+(T-2)+'" font-size="9" font-weight="700" fill="var(--accent)" text-anchor="middle">'+esc(mark.lab)+'</text>'; })():'')+
    '<polyline points="'+CHART.xy.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
    CHART.xy.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4" fill="'+col+'" stroke="var(--white)" stroke-width="2"/>').join('')+
    '<circle id="chartHi" r="7" fill="none" stroke="'+col+'" stroke-width="2" cx="'+CHART.xy[CHART.xy.length-1][0].toFixed(1)+'" cy="'+CHART.xy[CHART.xy.length-1][1].toFixed(1)+'"/>'+
    CHART.xy.map((p,i)=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="15" fill="transparent" onclick="chartPick('+i+')" style="cursor:pointer;"/>').join('')+
    '<text x="'+L+'" y="'+(H-4)+'" font-size="9" fill="var(--ink3)">'+first.getDate()+' '+MONTHS[first.getMonth()]+' '+String(first.getFullYear()).slice(2)+'</text>'+
    '<text x="'+(W-R)+'" y="'+(H-4)+'" font-size="9" fill="var(--ink3)" text-anchor="end">'+last.getDate()+' '+MONTHS[last.getMonth()]+' '+String(last.getFullYear()).slice(2)+'</text>'+
    '</svg>';
}
function chartRead(i){ const p=CHART.pts[i]; return dShort(p.d)+' '+String(parseD(p.d).getFullYear())+' · '+p.v+CHART.unit+' est. 1RM'; }
function chartPick(i){
  if(!CHART)return;
  const hi=document.getElementById('chartHi'), rd=document.getElementById('chartRead');
  if(hi){ hi.setAttribute('cx',CHART.xy[i][0].toFixed(1)); hi.setAttribute('cy',CHART.xy[i][1].toFixed(1)); }

function openLift(idx){

  } else h+='<div class="note">Bodyweight only so far, so there is no kg trend. Every session is listed below.</div>';

      (x.v1?' <span class="tagmini" style="background:var(--cream2);color:var(--ink3);">v1</span>':'')+'</div>'+
      '<div class="m-s">'+esc(setsSummary(x.sets))+'</div></div>'+
      '<div class="m-v"><div class="m-val" style="font-size:16px;">'+(x.v?x.v+'kg':'—')+'</div></div></div>').join('')+'</div>'+
    '<button class="btn btn-g" style="margin-top:6px;" onclick="closeSheet()">Close</button>';
  document.getElementById('sheetBody').innerHTML=h;
  document.getElementById('sheet').classList.add('open');
  if(pts.length>1)chartPick(pts.length-1);
}
// Recent activity across lifts, runs and benchmark tests, newest first.
function recentEntries(n){
  const out=[];
  ST.sessions.forEach(s=>{ if(s&&s.date&&((s.exercises||[]).length||s.finisher&&s.sid))out.push({kind:'lift',date:s.date,ref:s}); });
  ST.runs.forEach(r=>{ if(r&&r.date)out.push({kind:'run',date:r.date,ref:r}); });
  ST.benchmarks.forEach(b=>{ if(b&&b.date)out.push({kind:'bench',date:b.date,ref:b}); });
  return out.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0).slice(0,n);
}
function entryLabel(e){
  if(e.kind==='bench')return 'Benchmark';
  if(e.kind==='run')return e.ref.sid&&SESSIONS[e.ref.sid]?SESSIONS[e.ref.sid].label:'Run';
  if(e.ref.wod&&wodById(e.ref.wod))return wodById(e.ref.wod).name;
  return e.ref.sid&&SESSIONS[e.ref.sid]?SESSIONS[e.ref.sid].label:'Lift session';
}
function entryLine(e){
  if(e.kind==='bench')return benchTxt(e.ref)+' rounds';
  if(e.kind==='run')return (e.ref.km||0)+'km'+(e.ref.paceSec?' at '+paceStr(e.ref.paceSec):'');
  const ex=e.ref.exercises||[];
  if(!ex.length&&e.ref.finisher)return e.ref.finisher.kind+(e.ref.finisher.score?' — '+finScoreTxt(e.ref.finisher):'');
  return ex.length+(ex.length===1?' exercise':' exercises')+' · '+ex.slice(0,2).map(x=>x.name).join(', ')+(ex.length>2?'…':'');
}
function openEntry(i){
  const e=ENTRIES[i]; if(!e)return;
  const d=parseD(e.date), mine=e.kind==='bench'||!!e.ref.sid;
  let h='<div class="sheet-grab"></div><div class="sheet-t">'+esc(entryLabel(e))+'</div>'+
    '<div class="sheet-s">'+DOW[(d.getDay()+6)%7]+' '+d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear()+
    (e.ref.ctx&&CONTEXTS[e.ref.ctx]?' · '+esc(CONTEXTS[e.ref.ctx].label):'')+'</div>'+
    '<div class="card"><div class="logged-b" style="margin:0;">'+
      (e.kind==='bench'?esc(benchTxt(e.ref))+' rounds'+(e.ref.notes?'<br>'+esc(e.ref.notes):''):logSummary(e.ref,e.kind))+'</div></div>';
  if(!mine)h+='<div class="note">Imported from your v1 app. Kept exactly as it was.</div>';
  else h+='<button class="act danger" onclick="deleteEntry('+i+')"><span class="ai">✕</span><span>Delete this entry<small>Cannot be undone</small></span></button>';
  h+='<button class="btn btn-g" style="margin-top:6px;" onclick="closeSheet()">Close</button>';
  document.getElementById('sheetBody').innerHTML=h;
  document.getElementById('sheet').classList.add('open');
}
function deleteEntry(i){
  const e=ENTRIES[i]; if(!e)return;
  if(!confirm('Delete this entry? It cannot be undone.'))return;
  const arr=e.kind==='lift'?ST.sessions:e.kind==='run'?ST.runs:ST.benchmarks;
  const at=arr.indexOf(e.ref); if(at>-1)arr.splice(at,1);
  save(); closeSheet(); renderAll(); toast('Entry deleted');
}
// EMOM trial: best e1RM in the 6 weeks before the switch vs since, per headline lift.
function styleCard(){
  const since=emomSince(); if(!since)return '';
  const pre=localDateStr(addDays(parseD(since),-42));
  const rows=ANCHORS.map(k=>{ const pts=exSeries(ANCHOR_CANON[k],true);
    const best=(f,t)=>pts.filter(p=>p.d>=f&&(!t||p.d<t)).reduce((m,p)=>Math.max(m,p.v),0);
    const a=best(pre,since), b=best(since,null);
    PROG_NAMES.push(ANCHOR_CANON[k]);
    return '<div class="mrow" onclick="openLift('+(PROG_NAMES.length-1)+')" style="cursor:pointer;"><div class="m-l"><div class="m-n">'+esc(ANCHOR_CANON[k])+'</div><div class="m-s">'+(a?'Before '+a+'kg':'No sessions in the 6 weeks before')+'</div></div>'+
      '<div class="m-v"><div class="m-val" style="font-size:16px;">'+(b?b+'kg':'—')+'</div><div class="m-d">'+(a&&b?delta(b,a,'kg'):'')+'</div></div></div>'; }).join('');
  const em=ST.sessions.filter(x=>x&&x.style==='emom'&&x.date>=since), yes=em.filter(x=>x.clock==='yes').length, no=em.filter(x=>x.clock==='no').length;
  const wks=Math.floor(daysBetween(parseD(since),new Date())/7);
  return '<div class="card"><div class="ctitle">EMOM trial</div>'+
    '<div class="sub">Since '+dShort(since)+' ('+wks+(wks===1?' week':' weeks')+'). Best estimated max since vs the 6 weeks before. Give it 4–6 weeks before judging.</div>'+
    '<div style="margin-top:6px;">'+rows+'</div>'+
    (em.length?'<div class="ex-note" style="margin:10px 0 0;">'+em.length+' EMOM '+(em.length===1?'session':'sessions')+(yes+no?' · kept to the clock '+yes+' of '+(yes+no):'')+'</div>':'')+'</div>';
}
function consistencyCard(){
  const wk=weekLog(8);
  const cols=wk.map(w=>{
    const sq=[1,2,3].map(j=>'<div style="width:14px;height:10px;border-radius:3px;margin:2px auto;background:'+
      (w.lifts>=j?(j<=2?'var(--ink)':'var(--ink3)'):(j<=2?'var(--cream3)':'transparent'))+';"></div>').reverse().join('');
    return '<div style="flex:1;min-width:0;text-align:center;">'+sq+
      '<div style="font-size:11px;font-weight:800;margin-top:4px;color:'+(w.lifts>=2?'var(--ink)':'var(--ink3)')+';">'+w.lifts+(w.lifts>=2?'✓':'')+'</div>'+
      '<div style="font-size:9px;color:var(--ink3);font-weight:600;">'+(w.km?w.km+'k':'—')+'</div>'+
      '<div style="font-size:8.5px;color:'+(w.now?'var(--accent)':'var(--ink4)')+';font-weight:700;margin-top:3px;">'+(w.now?'now':w.ws.getDate()+'/'+(w.ws.getMonth()+1))+'</div></div>'; }).join('');
  const hit=wk.filter(w=>w.lifts>=2).length;
  return '<div class="card-lg"><div class="chd"><div><div class="ctitle">Last 8 weeks</div>'+
    '<div class="sub">Strength sessions per week (2 is the floor) and run km. '+hit+' of 8 weeks hit the floor.</div></div></div>'+
    '<div style="display:flex;gap:4px;align-items:flex-end;">'+cols+'</div>'+
    (ST.d10||Object.keys(ST.d10done||{}).length?(function(){ const t=new Date(), ws=mondayOf(t);
      return '<div class="ex-note" style="margin:12px 0 0;">Daily 10: <strong>'+d10Done(localDateStr(ws),localDateStr(t))+'</strong> this week · '+
        d10Done(localDateStr(addDays(t,-27)),localDateStr(t))+' in the last 4 weeks</div>'; })():'')+'</div>';
}

function progStrip(){
  const sq=anchorSeries('squat').map(p=>p.v), rs=runSeries();
  const km=rs.map(r=>r.km), pc=rs.filter(r=>r.pace>0).map(r=>r.pace);
  const cell=(label,val,vals,inv,col,d)=>'<div class="st"><div class="st-l">'+label+'</div>'+
    '<div class="st-v">'+val+'</div>'+(d||'')+'<div style="margin-top:4px;">'+spark(vals,64,20,inv,col)+'</div></div>';
  return '<div class="strip">'+
    cell('Squat e1RM',sq.length?sq[sq.length-1]+'kg':'—',sq,false,'var(--green)',sq.length>1?delta(sq[sq.length-1],sq[0],'kg'):'')+
    cell('Weekly km',km.length?km[km.length-1]:'—',km,false,'var(--accent)',km.length>1?delta(km[km.length-1],km[0],'km'):'')+
    cell('Avg pace',pc.length?paceStr(pc[pc.length-1]):'—',pc,true,'var(--accent)',pc.length>1?delta(pc[pc.length-1],pc[0],'pace',true):'')+
  '</div>';
}

// The session written out — exercises with sets/reps, notes, history and cues, and the
// finisher in full. Shared by Today and the day view so they always match.
function sessionBody(s,ctxId,d){
  let body='';
  if(s.kind==='strength'){
    if(CONTEXTS[ctxId].strength==='none'){
      body='<div class="warn">Travel day — no kit. Use the button below to move this somewhere it can happen.</div>';
    } else {
      const row=p=>{
        const pat=PATTERNS[p], v=exForDay(p,ctxId,d,s.id), isA=ANCHORS.indexOf(p)>-1, scheme=exScheme(p,v,s,ctxId,d);
        const tag=v.sub||v.hand||v.swapped?'<span class="tagmini t-sub">swapped</span>':'';
        const swap=v.bar?'<div class="ex-swap" style="color:var(--green);">Bar found — real pulling today.</div>':ctxId==='bare'&&(p==='pull'||p==='hpull')?'<div class="ex-swap">Nothing to pull on, so your legs are the weight — the harder they resist, the more it works. A bar beats it whenever you find one.</div>':ctxId==='full_gym'||p==='core'||p==='core2'?'':'<div class="ex-swap">'+pat.label+' pattern · normally '+esc(pat.full_gym.name)+'</div>';
        // History for THIS exercise, not the pattern — comparing like with like.
        let prog='';
        const ser=exSeries(v.name), lg=lastExLog(v.name), cue=progressCue(v.name,p,scheme,ST.unit||'kg');
        if(ser.length){ const cur=ser[ser.length-1].v, prev=ser.length>1?ser[ser.length-2].v:cur;
          prog='<div class="prog"><span class="prog-v">Last e1RM '+cur+'kg</span>'+(ser.length>1?delta(cur,prev,'kg'):'')+
            '<span style="margin-left:auto;">'+spark(ser.map(x=>x.v),52,16,false,'var(--green)')+'</span></div>'; }
        else if(lg) prog='<div class="prog"><span class="prog-v">Last time '+esc(setsSummary(lg.sets))+' · '+dShort(lg.date)+'</span></div>';
        else prog='<div class="prog"><span class="prog-v" style="color:var(--ink4);">'+
          (isA?'No history for this lift yet — log it to start the trend':'Not logged before')+'</span></div>';
        // Collapsed: name, sets and the weight to use. Tap for how-to, why, history and cues.
        const fresh=lg&&!isStale(lg.date), unit=ST.unit||'kg', sg=fresh?null:suggestWeight(v.name,scheme,unit);
        const top=fresh?Math.max.apply(null,lg.sets.map(t=>parseFloat(t.kg)||0)):0;
        const wt=cue&&cue.kind==='add'?'<span style="color:var(--green);">↑ '+cue.next+unit+'</span>'
          :top>0?'<span style="color:var(--ink2);">'+toDisp(top,unit)+unit+'</span>'
          :sg?'<span style="color:var(--accent);">~'+sg.disp+unit+(sg.per?' each':'')+'</span>':BW_EX[v.name]?'<span style="color:var(--ink3);">bodyweight</span>'
          :exNeeds(v.name).length?'<span style="color:var(--amber);">find your weight</span>':'';
        return '<div class="ex" onclick="this.classList.toggle(\'open\')"><div class="ex-pat">'+pat.icon+'</div><div class="ex-body">'+
          '<div class="ex-name" style="display:flex;align-items:flex-start;gap:6px;"><span style="flex:1;min-width:0;">'+esc(v.name)+' '+tag+'</span>'+
            (logFor(localDateStr(d),s.id)?'':'<button class="chip" style="padding:4px 10px;font-size:11px;" onclick="event.stopPropagation();openExSwap(\''+localDateStr(d)+'\',\''+s.id+'\',\''+p+'\',\''+ctxId+'\')">Swap</button>')+'</div>'+
          '<div class="ex-scheme">'+esc(scheme)+(wt?' · '+wt:'')+'</div>'+
          '<div class="ex-more"><div class="ex-note">'+esc(v.note)+'</div>'+
          (v.swapped?'<div class="ex-swap" style="color:var(--accent);">Your swap — instead of '+esc(v.swapFor)+'</div>':v.hand?'<div class="ex-swap" style="color:var(--red);">✋ Hand — instead of '+esc(v.handFor)+'</div>':v.sub?'<div class="ex-swap" style="color:var(--amber);">No '+esc(v.subWhy.toLowerCase())+' here — instead of '+esc(v.subFor)+'</div>':swap)+
          (v.handTip&&!/^Grip check/.test(v.handTip)?'<div class="ex-swap" style="color:var(--red);">✋ '+esc(v.handTip)+'</div>':'')+prog+
          (sg?'<div class="ex-swap" style="color:var(--accent);">Suggested '+sg.disp+sg.unit+sg.per+' · '+esc(sg.why)+'</div>':'')+
          (BW_EX[v.name]?'<div class="ex-swap" style="color:var(--accent);">'+esc(BW_EX[v.name])+'</div>':'')+
          (!fresh&&!sg&&!BW_EX[v.name]&&exNeeds(v.name).length?'<div class="ex-swap" style="color:var(--amber);">'+esc(FIND_TXT)+'</div>':'')+
          (cue&&cue.kind!=='same'?'<div class="ex-swap" style="color:'+(cue.kind==='add'?'var(--green)':'var(--amber)')+';">'+esc(cue.kind==='add'?'↑ Add weight today — try '+cue.next+unit:cue.text)+'</div>':'')+'</div></div></div>'; };
      const lay=sessionLayout(s,ctxId,d);
      body=(handHold()?'<div class="ex-swap" style="color:var(--red);margin:4px 0 2px;">✋ Stage '+handStage()+': the first set of anything you hold is a light grip check. Stop at sharp pain or a shock.</div>':'')+
        '<div class="ex-swap" style="margin:2px 0 4px;">Tap an exercise for how-to, history and why.</div>'+
        lay.map(b=>(b.label?'<div class="divider" style="margin:14px 0 4px;">'+esc(b.label)+'</div><div class="ex-note" style="margin:0 0 6px;">'+esc(b.title)+'</div>':'')+b.pats.map(row).join('')).join('');
      const f=finisherFor(s,d,ctxId);
      if(f)body+='<div class="fin" onclick="this.classList.toggle(\'open\')"><div class="fin-top"><div class="fin-kind">'+esc(f.kind)+'</div>'+
        '<div class="fin-dur">'+esc(f.dur)+' ▾</div></div><div class="fin-body">'+f[ctxId]+'</div>'+
        (logFor(localDateStr(d),s.id)||ctxId==='bare'?'':'<button class="chip" style="margin-top:8px;padding:4px 10px;font-size:11px;" onclick="event.stopPropagation();openFinSwap(\''+localDateStr(d)+'\',\''+s.id+'\',\''+ctxId+'\')">'+(f.swapped?'Swapped · change':'Swap finisher')+'</button>')+
        '<div class="ex-more">'+
        (f.sub?'<div class="fin-why" style="color:var(--amber);">Swapped for one that fits the kit here.</div>':'')+
        (f.handChanged?'<div class="fin-why" style="color:var(--red);">✋ Palm-loading moves swapped for your hand.</div>':'')+
        '<div class="fin-why">'+esc(f.why)+'</div></div></div>';
      if((CTX_KIT[ctxId]||[]).length){ const miss=missingAt(d);
        body+='<button class="lgadd" style="margin-top:10px;text-align:left;" onclick="event.stopPropagation();openKit(\''+localDateStr(d)+'\',\''+ctxId+'\')">'+
          (miss.length?'Missing here: '+esc(miss.map(k=>KIT[k]).join(', '))+' — change':'Something missing here? Mark it and the session adjusts')+'</button>'; }
      else if(BAR_CTX.indexOf(ctxId)>-1){ const hb=hasBar(ctxId,d);
        body+='<button class="lgadd" style="margin-top:10px;text-align:left;" onclick="event.stopPropagation();toggleBar(\''+localDateStr(d)+'\')">'+
          (hb?'✓ Pull-up bar here — tap if it is gone':'Found a pull-up bar? Tap and your back work becomes pull-ups')+'</button>'; }
    }
  } else if(s.kind==='cond'||condWorkout(s.id,d)){
    const w=condWorkout(s.id,d);
    body='<div class="fin" style="margin-top:4px;"><div class="fin-top"><div class="fin-kind">'+esc(w.kind)+'</div><div class="fin-dur">'+esc(w.dur)+'</div></div>'+
      '<div class="fin-body">'+w.text+'</div>'+(s.kind==='cond'?'<div class="fin-why">'+handText(ROPE_WARM,'bare')+'</div>':'')+
      (s.kind==='cond'||!indoorAt(d)?ropeNotes(d)+'<div class="fin-why">'+esc(handText(ROPE_WHY,'bare'))+'</div>':'<div class="fin-why">Same effort as the run would have been — easy means conversational, hard means hard.</div>')+'</div>';
  } else {
    const rs=runSeries(), last=rs[rs.length-1], prev=rs.length>1?rs[rs.length-2]:null, ri=runInfo(s,d);
    body='<div class="ex"><div class="ex-pat">🏃</div><div class="ex-body">'+
      '<div class="ex-name">'+esc(s.label)+'</div><div class="ex-scheme">'+esc(ri.detail)+'</div>'+
      '<div class="ex-note">'+esc(ri.blurb)+'</div>'+
      (last?'<div class="prog"><span class="prog-v">Last week '+last.km+'km'+(last.pace?' @ '+paceStr(last.pace):'')+'</span>'+
        (prev&&prev.pace&&last.pace?delta(last.pace,prev.pace,'pace',true):'')+
        '<span style="margin-left:auto;">'+spark(rs.map(r=>r.pace||0).filter(x=>x>0),52,16,true,'var(--accent)')+'</span></div>':'')+
      '</div></div>';
  }
  return body;
}
function renderUnplaced(u){

  const rs=runSeries(), km=rs.map(r=>r.km), pc=rs.filter(r=>r.pace>0).map(r=>r.pace);
  const runs=rs.length
    ? '<div class="mrow"><div style="flex-shrink:0;">'+spark(km,56,26,false,'var(--accent)')+'</div>'+
      '<div class="m-l"><div class="m-n">Weekly volume</div><div class="m-s">'+rs.length+' weeks</div></div>'+
      '<div class="m-v"><div class="m-val">'+km[km.length-1]+'km</div><div class="m-d">'+(km.length>1?delta(km[km.length-1],km[0],'km'):'')+'</div></div></div>'+
      (pc.length?'<div class="mrow"><div style="flex-shrink:0;">'+spark(pc,56,26,true,'var(--accent)')+'</div>'+
      '<div class="m-l"><div class="m-n">Average pace</div><div class="m-s">Lower is better</div></div>'+
      '<div class="m-v"><div class="m-val">'+paceStr(pc[pc.length-1])+'</div><div class="m-d">'+(pc.length>1?delta(pc[pc.length-1],pc[0],'pace',true):'')+'</div></div></div>':'')
    : '<div class="ex-note">No runs logged yet.</div>';
  const bs=benchSeries(), bv=bs.map(benchScore), bl=bs[bs.length-1];
  const bench=(bv.length
    ? '<div class="mrow"><div style="flex-shrink:0;">'+spark(bv,56,26,false,'var(--purple)')+'</div>'+
      '<div class="m-l"><div class="m-n">12-min AMRAP</div><div class="m-s">10 push-ups · 15 air squats · 10 burpees</div></div>'+
      '<div class="m-v"><div class="m-val">'+benchTxt(bl)+'</div><div class="m-d">'+(bv.length>1?delta(bv[bv.length-1],bv[0],' rds'):'')+'</div></div></div>'+
      bs.slice().reverse().map(b=>'<div class="mrow var"><div class="m-l"><div class="m-n">'+dShort(b.date)+' — '+benchTxt(b)+' rounds</div>'+
        (b.notes?'<div class="m-s">'+esc(b.notes)+'</div>':'')+'</div>'+
        '<button class="lgx" onclick="deleteBench(\''+esc(b.date)+'\')">✕</button></div>').join('')
    : '<div class="ex-note">Not tested yet. 12 minutes, no equipment — 10 push-ups, 15 air squats, 10 burpees.</div>')+
    (benchDue()&&bv.length?'<div class="warn" style="margin:12px 0 0;">Due — last test was '+dShort(bl.date)+'.</div>':'')+
    '<button class="btn btn-p" style="margin-top:12px;" onclick="openBench()">Log a test</button>';
  const ergKeys=['row1k','row2k','skiErg1k','skiErg2k'];
  const ergLabels={row1k:'Row 1k',row2k:'Row 2k',skiErg1k:'Ski erg 1k',skiErg2k:'Ski erg 2k'};
  const ergRows=ergKeys.map(k=>{ const v=ST.ergPRs[k];
    return '<div class="mrow"><div class="m-l"><div class="m-n">'+ergLabels[k]+'</div>'+
      '<div class="m-s">'+(v?'Imported from v1 — kept as history':'Never tested')+'</div></div>'+
      '<div class="m-v"><div class="m-val'+(v?' dim':' dim')+'">'+esc(v||'—')+'</div></div></div>'; }).join('');
  const imported=ST.importedCounts;
  ENTRIES=recentEntries(10);
  const recent=ENTRIES.length
    ? ENTRIES.map((e,i)=>'<div class="mrow" onclick="openEntry('+i+')" style="cursor:pointer;"><div class="m-l">'+
        '<div class="m-n">'+esc(entryLabel(e))+(e.kind==='lift'&&!e.ref.sid?' <span class="tagmini" style="background:var(--cream2);color:var(--ink3);">v1</span>':'')+'</div>'+
        '<div class="m-s">'+esc(entryLine(e))+'</div></div>'+
        '<div class="m-v"><div style="font-size:11px;font-weight:700;color:var(--ink3);">'+dShort(e.date)+'</div></div></div>').join('')
    : '<div class="ex-note">Nothing logged yet.</div>';
  document.getElementById('pg-bench').innerHTML=
    consistencyCard()+styleCard()+bodyCard()+
    (imported?'<div class="note">Imported from your v1 app: '+imported.lifts+' lift sessions and '+imported.runs+' runs. v1 was read once and is never written to.</div>':'')+
    maxesCard()+
    '<div class="card-lg"><div class="chd"><div><div class="ctitle">Strength — the four anchors</div>'+
      '<div class="sub">One headline lift per pattern, fixed for the whole trip. Travel variants sit indented on their own lines — mixing a goblet squat into your back squat trend would make it saw up and down as you move and tell you nothing. Tap any lift for its full history.</div></div></div>'+lifts+'</div>'+
    '<div class="card-lg"><div class="chd"><div><div class="ctitle">Running</div>'+
      '<div class="sub">Volume and pace, week by week</div></div></div>'+runs+'</div>'+
    '<div class="card-lg"><div class="chd"><div><div class="ctitle">Travel-proof benchmark</div>'+
      '<div class="sub">Re-tested every block · needs no equipment</div></div></div>'+bench+'</div>'+
    '<div class="card-lg"><div class="chd"><div><div class="ctitle">Erg benchmarks</div>'+
      '<div class="sub">Rower and ski erg</div></div></div>'+
      '<div class="stale" style="margin-bottom:12px;">Kept as history while you have no rower. Split targets stay paused rather than being driven by numbers that no longer describe you.</div>'+
      ergRows+'</div>'+
    '<div class="card-lg"><div class="chd"><div><div class="ctitle">Recent</div>'+
      '<div class="sub">Last ten things you logged. Tap one for the detail.</div></div></div>'+recent+'</div>'+
    backupCard();
}
function nav(pg,btn,keepMove){
  if(!keepMove&&MOVE){ MOVE=null; }
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('pg-'+pg).classList.add('active');
  document.querySelectorAll('.ni').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); window.scrollTo(0,0);
  if(pg==='week')renderWeek();
}
function renderAll(){
  DAY_CTX=dayContexts();
  const ti=todayIdx();
  if(ti>=0)CTX=DAY_CTX[ti];
  const seg=currentSeg();
  document.getElementById('wkb').textContent='Block wk '+blockWeek()+' · '+(seg?seg.place:'Travelling')+' 📍';
  renderChips(); renderToday(); renderWeek(); renderTrip(); renderProgress();
}
try{ renderAll(); }catch(e){
  document.body.innerHTML='<div style="padding:40px;font-family:sans-serif;color:#221F20;">'+
    '<h2 style="margin-bottom:12px;">Startup error</h2><p style="margin-bottom:8px;">'+e.message+'</p>'+
    '<pre style="font-size:11px;color:#666;white-space:pre-wrap;">'+e.stack+'</pre></div>';
}
</script>
</body>
</html>
