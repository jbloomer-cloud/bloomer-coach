<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="REPS">
<meta name="theme-color" content="#F5F3EE">
<title>REPS</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,600;1,700;1,800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F5F3EE;--cream2:#EDEAE3;--cream3:#E0DDD6;--white:#FFFFFF;
  --ink:#221F20;--ink2:#4A4740;--ink3:#8A877F;--ink4:#C4C1BA;
  --accent:#0000F5;--accent-l:#E6E6FF;
  --lime:#D2FC51;--lime-l:#F2FECC;
  --green:#1A7A4A;--green-l:#E8F5EE;
  --amber:#C4640A;--amber-l:#FEF3E7;
  --red:#C42A2A;--red-l:#FDEEE8;
  --purple:#6B3FA0;--purple-l:#F3EDFC;
  --sh-sm:0 1px 3px rgba(34,31,32,.06),0 1px 2px rgba(34,31,32,.04);
  --sh:0 4px 12px rgba(34,31,32,.08),0 1px 3px rgba(34,31,32,.05);
  --r:16px;--rs:10px;--rx:20px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--cream);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
.phone{max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:92px;}
.proto{background:var(--purple-l);color:var(--purple);font-size:11px;font-weight:700;padding:7px 16px;text-align:center;}
.hdr{padding:max(12px,env(safe-area-inset-top)) 20px 12px;display:flex;align-items:center;justify-content:space-between;position:relative;}
.hdr::after{content:'';position:absolute;bottom:0;left:20px;right:20px;height:1px;background:var(--cream3);}
.logo{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-size:24px;font-weight:800;}
.logo span{color:var(--accent);}
.wkb{font-size:10.5px;font-weight:700;color:var(--ink3);background:var(--cream2);padding:5px 11px;border-radius:20px;text-transform:uppercase;}
.ctxbar{padding:14px 16px 4px;}
.ctxlabel{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);margin-bottom:8px;display:flex;justify-content:space-between;}
.ctxlabel .hint{text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink4);}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex-shrink:0;background:var(--white);border:1.5px solid var(--cream3);border-radius:20px;padding:8px 14px;font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer;font-family:inherit;}
.chip.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.page{display:none;padding:12px 16px 20px;}
.page.active{display:block;animation:fadeUp .18s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--white);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--sh-sm);}
.card-lg{background:var(--white);border-radius:var(--rx);padding:20px;margin-bottom:10px;box-shadow:var(--sh);}
.chd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;gap:10px;}
.ctitle{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);}
.big{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-size:26px;font-weight:800;line-height:1.1;}
.sub{font-size:12px;color:var(--ink3);margin-top:3px;line-height:1.5;}
.divider{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--ink4);margin:18px 0 8px;}
.ex{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--cream2);}
.ex:first-of-type{border-top:none;}
.ex-pat{flex-shrink:0;width:30px;height:30px;border-radius:9px;background:var(--cream2);display:flex;align-items:center;justify-content:center;font-size:14px;}
.ex-body{min-width:0;flex:1;}
.ex-name{font-size:14px;font-weight:600;line-height:1.3;}
.ex-scheme{font-size:11px;color:var(--accent);font-weight:700;margin-top:2px;}
.ex-note{font-size:11px;color:var(--ink3);margin-top:4px;line-height:1.5;}
.ex-swap{font-size:10px;color:var(--ink4);margin-top:3px;font-weight:600;}
/* inline progression */
.prog{display:flex;align-items:center;gap:7px;margin-top:5px;background:var(--cream);border-radius:7px;padding:5px 8px;}
.prog-v{font-size:11px;font-weight:700;color:var(--ink2);min-width:0;}
.prog-d{font-size:10.5px;font-weight:700;white-space:nowrap;}
.up{color:var(--green);} .down{color:var(--red);} .flat{color:var(--ink4);}
.tagmini{display:inline-block;font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;text-transform:uppercase;vertical-align:1px;}
.t-same{background:var(--green-l);color:var(--green);}
.t-close{background:var(--amber-l);color:var(--amber);}
.t-min{background:var(--purple-l);color:var(--purple);}
.t-anchor{background:var(--ink);color:#fff;}
.fin{background:var(--lime-l);border-radius:var(--rs);padding:13px;margin-top:14px;}
.fin-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
.fin-kind{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-size:19px;font-weight:800;}
.fin-dur{font-size:10px;font-weight:700;color:var(--ink3);background:var(--white);padding:3px 9px;border-radius:20px;}
.fin-body{font-size:12px;color:var(--ink2);line-height:1.65;}
.fin-why{font-size:10.5px;color:var(--ink3);margin-top:7px;padding-top:7px;border-top:1px solid rgba(34,31,32,.08);line-height:1.5;}
.blk{display:flex;gap:9px;align-items:center;background:var(--white);border-radius:var(--r);padding:13px 15px;margin-bottom:10px;box-shadow:var(--sh-sm);}
.blk-dots{display:flex;gap:4px;flex-shrink:0;}
.dot{width:9px;height:9px;border-radius:50%;background:var(--cream3);}
.dot.on{background:var(--ink);} .dot.de{background:var(--amber);}
/* week rows */
.wk{display:flex;flex-direction:column;gap:7px;}
.wd{background:var(--white);border-radius:var(--r);padding:11px 12px;box-shadow:var(--sh-sm);display:flex;align-items:center;gap:10px;border:1.5px solid transparent;}
.wd.today{border-color:var(--accent);}
.wd.conflict{border-color:var(--amber);}
.wd-day{flex-shrink:0;width:34px;text-align:center;}
.wd-dow{font-size:10px;font-weight:700;color:var(--ink4);text-transform:uppercase;}
.wd-num{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-size:19px;font-weight:700;line-height:1;}
.wd-body{flex:1;min-width:0;}
.wd-title{font-size:13px;font-weight:600;line-height:1.3;}
.wd-meta{font-size:10.5px;color:var(--ink3);margin-top:2px;}
.wd-ctx{flex-shrink:0;font-size:9px;font-weight:700;padding:3px 7px;border-radius:5px;text-transform:uppercase;white-space:nowrap;}
.wd-grip{flex-shrink:0;width:30px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--ink4);cursor:pointer;border-radius:8px;background:var(--cream);}
.moved{background:var(--amber-l);color:var(--amber);font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;}
.core{background:var(--ink);color:#fff;font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;}
.pin{background:var(--accent-l);color:var(--accent);font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;}
/* kit */
.kitgrid{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.kchip{background:var(--white);border:1.5px solid var(--cream3);border-radius:20px;padding:7px 12px;font-family:inherit;font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer;}
.kchip.miss{background:var(--red-l);border-color:var(--red-l);color:var(--red);text-decoration:line-through;}
.t-sub{background:var(--amber-l);color:var(--amber);}
/* tap-to-move */
.movebar{position:sticky;top:0;z-index:50;background:var(--ink);color:#fff;border-radius:var(--r);padding:10px 12px 10px 14px;display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px;font-weight:600;box-shadow:var(--sh);}
.movebar button{margin-left:auto;background:#fff;color:var(--ink);border:none;border-radius:20px;padding:7px 13px;font-family:inherit;font-size:12px;font-weight:700;}
.wd.moving{border-color:var(--accent);background:var(--accent-l);}
.wd.drop{border:1.5px dashed var(--accent);}
.wd.nodrop{opacity:.4;}
.wd-grip.off{visibility:hidden;}
.dayacts{display:flex;gap:7px;margin-top:14px;}
.dayacts .btn{padding:12px 6px;}
/* action sheet — lives OUTSIDE any scroll container */
.sheet{position:fixed;inset:0;z-index:400;display:none;align-items:flex-end;}
.sheet.open{display:flex;}
.sheet-bg{position:absolute;inset:0;background:rgba(26,24,20,.5);backdrop-filter:blur(4px);}
.sheet-p{position:relative;background:var(--cream);border-radius:24px 24px 0 0;width:100%;max-width:430px;margin:0 auto;max-height:88vh;overflow-y:auto;padding:18px 18px max(26px,env(safe-area-inset-bottom));box-shadow:0 -8px 40px rgba(26,24,20,.18);}
.sheet-grab{width:40px;height:4px;background:var(--cream3);border-radius:2px;margin:0 auto 15px;}
.sheet-t{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-size:22px;font-weight:800;}
.sheet-s{font-size:12px;color:var(--ink3);margin-top:2px;margin-bottom:16px;line-height:1.5;}
.act{width:100%;background:var(--white);border:none;border-radius:var(--r);padding:14px 15px;font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);text-align:left;cursor:pointer;margin-bottom:8px;box-shadow:var(--sh-sm);display:flex;align-items:center;gap:11px;}
.act .ai{width:22px;text-align:center;font-size:15px;flex-shrink:0;}
.act small{display:block;font-size:11px;font-weight:600;color:var(--ink3);margin-top:1px;}
.act.danger{color:var(--red);}
.daygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px;}
.dbtn{background:var(--white);border:1.5px solid var(--cream3);border-radius:var(--rs);padding:9px 4px;font-family:inherit;cursor:pointer;text-align:center;}
.dbtn:disabled{opacity:.35;}
.dbtn .dd{font-size:10px;font-weight:700;color:var(--ink4);text-transform:uppercase;}
.dbtn .dn{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-size:17px;font-weight:700;}
.dbtn .dx{font-size:8.5px;font-weight:700;margin-top:2px;}
/* trip */
.seg{background:var(--white);border-radius:var(--r);padding:14px;margin-bottom:9px;box-shadow:var(--sh-sm);border-left:4px solid var(--cream3);}
.seg.now{border-left-color:var(--accent);}
.seg-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:5px;}
.seg-place{font-size:15px;font-weight:700;}
.seg-when{font-size:11px;color:var(--ink3);font-weight:600;}
.seg-focus{font-size:11.5px;color:var(--ink2);line-height:1.55;margin-top:7px;padding-top:8px;border-top:1px solid var(--cream2);}
.seg-badge{font-size:9px;font-weight:700;padding:3px 8px;border-radius:5px;text-transform:uppercase;white-space:nowrap;}
.phase{border-radius:var(--r);padding:14px;margin-bottom:10px;}
.phase-l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;opacity:.75;}
.phase-n{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-size:22px;font-weight:800;margin-top:2px;}
.phase-d{font-size:11.5px;line-height:1.55;margin-top:5px;opacity:.9;}
/* numbers */
.mrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--cream2);}
.mrow:first-of-type{border-top:none;}
.m-l{flex:1;min-width:0;}
.m-n{font-size:13px;font-weight:600;}
.m-s{font-size:10.5px;color:var(--ink4);margin-top:1px;}
.m-v{text-align:right;flex-shrink:0;}
.m-val{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-size:20px;font-weight:700;line-height:1;}
.m-val.dim{color:var(--ink4);}
.m-d{font-size:10px;font-weight:700;margin-top:2px;}
.stale{background:var(--amber-l);border-radius:var(--rs);padding:11px 13px;font-size:11.5px;color:var(--amber);line-height:1.55;font-weight:600;}
.strip{display:flex;gap:8px;margin-bottom:10px;}
.st{flex:1;background:var(--white);border-radius:var(--r);padding:11px 10px;box-shadow:var(--sh-sm);min-width:0;}
.st-l{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink4);}
.st-v{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-size:19px;font-weight:700;line-height:1.1;margin-top:2px;}
.st-d{font-size:9.5px;font-weight:700;}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(245,243,238,.95);backdrop-filter:blur(20px);border-top:1px solid var(--cream3);display:flex;padding-bottom:max(8px,env(safe-area-inset-bottom));z-index:100;}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 6px;cursor:pointer;color:var(--ink4);font-size:9.5px;font-weight:700;text-transform:uppercase;border:none;background:none;font-family:inherit;}
.ni.active{color:var(--accent);}
.ni svg{width:21px;height:21px;}
.btn{width:100%;padding:13px;border-radius:var(--r);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;border:none;background:var(--ink);color:#fff;}
.btn-g{background:transparent;border:1.5px solid var(--cream3);color:var(--ink2);}
.note{background:var(--accent-l);border-radius:var(--rs);padding:11px 13px;font-size:11.5px;color:var(--accent);line-height:1.55;font-weight:600;margin-bottom:12px;}
.warn{background:var(--amber-l);border-radius:var(--rs);padding:11px 13px;font-size:11.5px;color:var(--amber);line-height:1.55;font-weight:600;margin-bottom:12px;}
/* logging */
.lg-hint{font-size:11px;color:var(--ink3);background:var(--cream2);border-radius:var(--rs);padding:9px 11px;margin-bottom:12px;line-height:1.5;font-weight:600;}
.lgex{background:var(--white);border-radius:var(--r);padding:13px;margin-bottom:9px;box-shadow:var(--sh-sm);}
.lgex-n{font-size:14px;font-weight:700;line-height:1.3;}
.lgex-s{font-size:11px;color:var(--accent);font-weight:700;margin-top:2px;}
.lg-last{font-size:10.5px;color:var(--ink3);margin-top:4px;font-weight:600;line-height:1.5;}
.lglab,.lgset{display:grid;grid-template-columns:22px 1fr 1fr 30px;gap:7px;align-items:center;}
.lglab{margin:11px 0 5px;}
.lglab div{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink4);text-align:center;}
.lgset{margin-bottom:6px;}
.lgn{font-family:'Barlow Condensed',sans-serif;font-style:italic;font-size:15px;font-weight:700;color:var(--ink4);text-align:center;}
.lgi{width:100%;min-width:0;background:var(--cream);border:1.5px solid var(--cream3);border-radius:9px;padding:10px 6px;font-family:inherit;font-size:16px;font-weight:600;color:var(--ink);text-align:center;}
.lgi:focus{outline:none;border-color:var(--accent);background:var(--white);}
.lgx{background:none;border:none;color:var(--ink4);font-size:13px;cursor:pointer;padding:4px;font-family:inherit;}
.lgadd{background:var(--cream2);border:none;border-radius:9px;padding:9px;width:100%;font-family:inherit;font-size:11.5px;font-weight:700;color:var(--ink2);cursor:pointer;margin-top:3px;}
.lgt{width:100%;background:var(--cream);border:1.5px solid var(--cream3);border-radius:9px;padding:10px 11px;font-family:inherit;font-size:16px;color:var(--ink);resize:none;}
.lgt:focus{outline:none;border-color:var(--accent);background:var(--white);}
.lgpace{font-size:11.5px;font-weight:700;color:var(--accent);margin-top:9px;}
.logged{background:var(--green-l);border-radius:var(--rs);padding:12px 13px;margin-bottom:12px;}
.logged-t{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--green);}
.logged-b{font-size:12px;color:var(--ink2);line-height:1.7;margin-top:5px;}
.tick{background:var(--green-l);color:var(--green);font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;}
.draft{background:var(--amber-l);color:var(--amber);font-size:9px;font-weight:700;padding:2px 6px;border-radius:5px;}
.btn-p{background:var(--accent);}
.mrow.var{padding-left:12px;border-top:1px dashed var(--cream2);}
.mrow.var .m-n{font-size:12px;color:var(--ink2);font-weight:600;}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:11px 18px;border-radius:30px;opacity:0;transition:all .22s;z-index:500;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="phone">
<div class="hdr"><div class="logo">REPS<span>.</span></div><div class="wkb" id="wkb" onclick="openMoved()" style="cursor:pointer;" title="Moved on? Tap to start a new leg">—</div></div>
<div class="ctxbar">
  <div class="ctxlabel"><span>Today I have access to</span><span class="hint">tap to switch →</span></div>
  <div class="chips" id="ctxChips"></div>
</div>
<div class="page active" id="pg-today"></div>
<div class="page" id="pg-week"></div>
<div class="page" id="pg-trip"></div>
<div class="page" id="pg-bench"></div>
<div class="nav">
  <button class="ni active" onclick="nav('today',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>Today</button>
  <button class="ni" onclick="nav('week',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Week</button>
  <button class="ni" onclick="nav('trip',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>Trip</button>
  <button class="ni" onclick="nav('bench',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>Progress</button>
</div>
</div>

<!-- ACTION SHEET — outside everything, fixed positioning -->
<div class="sheet" id="sheet">
  <div class="sheet-bg" onclick="closeSheet()"></div>
  <div class="sheet-p" id="sheetBody"></div>
</div>
<!-- LOG SHEET — also outside everything -->
<div class="sheet" id="logSheet">
  <div class="sheet-bg" onclick="closeLog()"></div>
  <div class="sheet-p" id="logBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════════════
// REPS v2 — stage 1: shell, persistent state, migration, scheduler
//
//  - programme written in MOVEMENT PATTERNS, resolved per CONTEXT
//  - two CORE full-body sessions a week, conditioning built in
//  - 3 load weeks + 1 deload; block TYPE set by equipment on that leg
//  - sessions MOVE, never vanish
//  - state lives under REPSv2. BLMv2 (v1) is never written to.
// ══════════════════════════════════════════════════════════════════

// ── Date helpers. Never toISOString for a day key — it shifts in BST. ──
function localDateStr(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function safeDate(v){ if(!v) return null; const d=new Date(v); return isNaN(d.getTime())?null:d; }
function parseD(s){ const d=safeDate(s+'T00:00:00'); return d||new Date(); }
function mondayOf(d){ const x=new Date(d); const dow=(x.getDay()+6)%7; x.setDate(x.getDate()-dow); x.setHours(0,0,0,0); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function daysBetween(a,b){ return Math.floor((b-a)/864e5); }

function mainRace(){ return (ST.races||[]).filter(r=>r&&r.main&&/^\d{4}-\d{2}-\d{2}$/.test(r.date))[0]||null; }
function phases(){

  if(!r)return [build];

      for(let step=0;step<7&&!placed;step++){ const i=ideal[id]+step; if(i>=7)break;
        if(step>0&&i<todayIdx())continue;
        if(!slots[i]&&!off[i]&&canHold(id,DAY_CTX[i])){ slots[i]={id,slid:step!==0,from:ideal[id]}; placed=true; } }
      // wrap-around fallback never reaches back into days already gone this week
      for(let i=Math.max(0,todayIdx());i<7&&!placed;i++){
        if(!slots[i]&&!off[i]&&canHold(id,DAY_CTX[i])){ slots[i]={id,slid:true,from:ideal[id]}; placed=true; } }
      if(!placed)unplaced.push(id);
    });
  if(race)slots.forEach((x,i)=>{ if(x&&x.id==='run_l'&&i===race.idx){ x.race=race.race; x.slid=false; } });
  // Lifts with nowhere to go because of travel days: a rope + bodyweight session
  // on a free travel day instead (up to two a week).
  if(ST.rope!==false){
    let n=Math.min(2,unplaced.filter(id=>SESSIONS[id].kind==='strength').length);
    const ids=['rope','rope2'].filter(id=>!pinnedIds.has(id)&&!slots.some(x=>x&&x.id===id)&&skipped().indexOf(id)<0);
    // spread them out: at least one day between rope sessions when the week allows
    const free=[]; for(let i=Math.max(0,todayIdx());i<7;i++)if(!slots[i]&&!off[i]&&DAY_CTX[i]==='travel')free.push(i);
    const pick=[]; free.forEach(i=>{ if(pick.length<n&&(!pick.length||i-pick[pick.length-1]>=2))pick.push(i); });
    free.forEach(i=>{ if(pick.length<n&&pick.indexOf(i)<0)pick.push(i); });
    pick.slice(0,Math.min(n,ids.length)).forEach(i=>{ slots[i]={id:ids.shift(),slid:false,from:i,auto:true}; });

function snapshot(){ if(isManual())return; const {slots}=schedule(); const P=pins();
  slots.forEach((s,i)=>{ if(s)P[i]=s.id; }); save(); }
// A logged session belongs to its date; moving it would orphan the log.
function loggedAt(i){ const sl=schedule().slots[i]; return sl&&logFor(localDateStr(dayDate(i)),sl.id)?sl:null; }
function lockedMsg(i){ toast(DOW[i]+' is logged — delete the log first to move it'); }
function moveSession(from,to){
  if(loggedAt(from)){ lockedMsg(from); return; } if(loggedAt(to)){ lockedMsg(to); return; }
  if(pauseAt(dayDate(to))){ toast(DOW[to]+' is paused'); return; }
  snapshot(); const P=pins();
  const a=P[from]||null,b=P[to]||null;
  if(b)P[from]=b; else delete P[from];
  P[to]=a; save(); renderAll();
  toast(b?'Swapped '+DOW[from]+' and '+DOW[to]:SESSIONS[a].label+' → '+DOW[to]); }
function pushSession(i){ if(loggedAt(i)){ lockedMsg(i); return; }
  snapshot(); const P=pins(); const id=P[i]; if(!id)return;
  for(let step=1;step<7;step++){ const t=(i+step)%7;
    if(!P[t]&&canHold(id,DAY_CTX[t])){ delete P[i]; P[t]=id; save(); renderAll();
      toast(SESSIONS[id].label+' pushed to '+DOW[t]); return; } }
  toast('No free day that can hold it'); }
// Skip: gone for this week, not quietly re-placed on another day.
function clearDay(i){ if(loggedAt(i)){ lockedMsg(i); return; }
  const sl=schedule().slots[i]; if(!sl)return;
  if(!ST.skips[weekKey()])ST.skips[weekKey()]=[];
  if(ST.skips[weekKey()].indexOf(sl.id)<0)ST.skips[weekKey()].push(sl.id);
  snapshot(); delete pins()[i]; save(); renderAll(); toast(SESSIONS[sl.id].label+' skipped this week'); }
function resetWeek(){ delete ST.pins[weekKey()]; delete ST.skips[weekKey()]; save(); renderAll(); toast('Back to automatic'); }
function unskip(id){ const a=ST.skips[weekKey()]||[]; ST.skips[weekKey()]=a.filter(x=>x!==id); save(); renderAll(); toast(SESSIONS[id].label+' back in the week'); }
// Pull any not-yet-done session of this week onto day i. If it sits on another
// day, the two swap; if it was carried (no day could hold it), it lands here and
// whatever was here re-flows to a free day.
function bringHere(id,i){
  if(loggedAt(i)){ lockedMsg(i); return; }
  if(pauseAt(dayDate(i))){ toast(DOW[i]+' is paused'); return; }
  if(!canHold(id,DAY_CTX[i])){ toast(CONTEXTS[DAY_CTX[i]].label+' cannot hold '+SESSIONS[id].label); return; }
  const {slots}=schedule(), from=slots.findIndex(x=>x&&x.id===id);
  if(from===i)return;
  if(from>-1){ moveSession(from,i); return; }
  snapshot(); const P=pins(); P[i]=id; save(); renderAll(); toast(SESSIONS[id].label+' → '+DOW[i]);
}
// Sessions in this week that could come to day i: not already there, not logged.
function bringable(i){
  const {slots,unplaced}=schedule(), out=[];
  slots.forEach((x,j)=>{ if(x&&j!==i&&!logFor(localDateStr(dayDate(j)),x.id))out.push({id:x.id,from:j}); });
  unplaced.forEach(id=>out.push({id:id,from:-1}));
  if(ST.rope!==false&&!slots.some(x=>x&&x.id==='rope')&&skipped().indexOf('rope')<0)out.push({id:'rope',from:-1,extra:true});

}
function setDayCtx(i,k){ ST.dayCtx[localDateStr(dayDate(i))]=k; save(); renderAll();
  toast(DOW[i]+' → '+CONTEXTS[k].label); }

// ══ PROGRESSION — computed from real logs ══
function epley(sets){ let best=0;
  (sets||[]).forEach(s=>{ const kg=parseFloat(s.kg)||0, reps=Math.max(parseInt(s.reps)||0,1);
    if(kg>0){ const e=kg*(1+reps/30); if(e>best)best=e; } });
  return best>0?Math.round(best*2)/2:0; }
// One series per EXERCISE NAME, so every point on a line is the same lift.
// Bodyweight work scores 0 through epley and so never enters a loaded trend.
function exSeries(name,all){
  const out=[];
  ST.sessions.forEach(s=>{
    if(!s||!s.date)return;
    (s.exercises||[]).forEach(e=>{
      if(e.name===name){ const v=epley(e.sets); if(v>0)out.push({d:s.date,v}); }
    });
  });
  out.sort((a,b)=>(safeDate(a.d)||0)-(safeDate(b.d)||0));
  return all?out:out.slice(-12);
}
// Every logged instance of one exercise, newest first, for the detail view.
function liftHistory(name){
  const out=[];
  ST.sessions.forEach(s=>{
    if(!s||!s.date)return;
    (s.exercises||[]).forEach(e=>{ if(e.name===name&&(e.sets||[]).length)
      out.push({date:s.date,sets:e.sets,v:epley(e.sets),ctx:s.ctx||null,v1:!s.sid}); });
  });
  return out.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
}
// Strength sessions and run km per week, oldest first.
function weekLog(n){
  const out=[], m0=mondayOf(new Date());
  for(let i=n-1;i>=0;i--){
    const ws=addDays(m0,-7*i), k=localDateStr(ws), ke=localDateStr(addDays(ws,7));
    const lifts=ST.sessions.filter(s=>s&&s.date>=k&&s.date<ke&&(s.exercises||[]).length).length;
    const km=ST.runs.filter(r=>r&&r.date>=k&&r.date<ke).reduce((a,r)=>a+(parseFloat(r.km)||0),0);
    out.push({k:k,ws:ws,lifts:lifts,km:Math.round(km*10)/10,now:i===0});
  }
  return out;
}
function anchorSeries(pattern){ return exSeries(ANCHOR_CANON[pattern]); }
// Every exercise name that belongs to a pattern: the v1 names, the v2 variants
// for each context, and anything already logged carrying that pattern key.
function patternNames(pattern){
  const seen={},order=[];
  const add=n=>{ if(n&&!seen[n]){ seen[n]=1; order.push(n); } };
  add(ANCHOR_CANON[pattern]);
  (ANCHOR_NAMES[pattern]||[]).forEach(add);
  const P=PATTERNS[pattern]||{};
  CTX_ORDER.forEach(k=>{ if(P[k]&&P[k].name)add(P[k].name); (ROTATE[pattern]&&ROTATE[pattern][k]||[]).forEach(r=>add(r.name)); });
  ST.sessions.forEach(s=>(s&&s.exercises||[]).forEach(e=>{ if(e.pattern===pattern)add(e.name); }));
  return order;
}
// Most recent log of one exact exercise, for prefill and the "last time" cue.
function lastExLog(name,skipKey){
  let best=null;
  ST.sessions.forEach(s=>{
    if(!s||!s.date)return;
    if(skipKey&&logKey(s.date,s.sid)===skipKey)return;
    (s.exercises||[]).forEach(e=>{
      if(e.name===name&&(e.sets||[]).length&&(!best||s.date>best.date))best={date:s.date,sets:e.sets};
    });
  });
  return best;
}
// Weights are always STORED in kg. lb is only for typing them in and reading them back.
const LB=2.20462;
function toDisp(kg,unit){ kg=parseFloat(kg)||0; if(!kg)return ''; return unit==='lb'?String(Math.round(kg*LB*2)/2):String(kg); }
function fromDisp(v,unit){ const n=parseFloat(v)||0; return unit==='lb'?Math.round(n/LB*10)/10:n; }
function setsSummary(sets,unit){
  const v=(sets||[]).filter(s=>(parseInt(s.reps)||0)>0);
  if(!v.length)return 'no sets';
  const reps=v.map(s=>parseInt(s.reps)||0), kgs=v.map(s=>parseFloat(s.kg)||0);
  const kgTxt=k=>k>0?' @ '+(unit==='lb'?toDisp(k,'lb')+'lb':(Math.round(k*2)/2)+'kg'):' bodyweight';
  if(reps.every(r=>r===reps[0])&&kgs.every(k=>k===kgs[0]))return v.length+'×'+reps[0]+kgTxt(kgs[0]);
  let b=0; kgs.forEach((k,i)=>{ if(k>kgs[b])b=i; });
  return v.length+' sets · top '+reps[b]+kgTxt(kgs[b]);
}
function dShort(ds){ const d=safeDate(ds); return d?d.getDate()+' '+MONTHS[d.getMonth()]:''; }
function runSeries(){
  const byWeek={};
  ST.runs.forEach(r=>{
    const d=safeDate(r.date); if(!d)return;
    const k=localDateStr(mondayOf(d));
    if(!byWeek[k])byWeek[k]={d:k,km:0,paceSum:0,n:0};
    byWeek[k].km+=parseFloat(r.km)||0;
    if(r.paceSec){ byWeek[k].paceSum+=r.paceSec; byWeek[k].n++; }
  });
  return Object.keys(byWeek).sort().map(k=>({d:k,km:Math.round(byWeek[k].km*10)/10,
    pace:byWeek[k].n?Math.round(byWeek[k].paceSum/byWeek[k].n):0})).slice(-12);
}
function benchSeries(){ return ST.benchmarks.slice().sort((a,b)=>(safeDate(a.date)||0)-(safeDate(b.date)||0)).slice(-12); }
function monthsSince(ds){ const d=safeDate(ds); if(!d)return null; return Math.floor((new Date()-d)/(30.44*864e5)); }

// ══ UI HELPERS ══
function esc(s){ const d=document.createElement('div'); d.textContent=String(s); return d.innerHTML; }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2000); }
function spark(vals,w,h,invert,col){
  if(!vals||vals.length<2)return '';
  const mn=Math.min.apply(null,vals),mx=Math.max.apply(null,vals),rg=(mx-mn)||1;
  const pts=vals.map((v,i)=>{ const x=(i/(vals.length-1))*(w-4)+2;
    let t=(v-mn)/rg; if(invert)t=1-t; const y=h-2-t*(h-4); return x.toFixed(1)+','+y.toFixed(1); });
  const last=pts[pts.length-1].split(',');
  return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="display:block;overflow:visible;">'+
    '<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<circle cx="'+last[0]+'" cy="'+last[1]+'" r="2.6" fill="'+col+'"/></svg>';
}
function delta(cur,prev,unit,lowerBetter){
  const d=cur-prev, good=lowerBetter?d<0:d>0;
  const cls=d===0?'flat':good?'up':'down', arrow=d===0?'·':good?'▲':'▼';
  const txt=unit==='pace'?((d>0?'+':'−')+Math.abs(Math.round(d))+'s')
    :((d>0?'+':d<0?'−':'')+Math.abs(d).toFixed(1).replace(/\.0$/,'')+(unit||''));
  return '<span class="prog-d '+cls+'">'+arrow+' '+txt+'</span>';
}

// ── Tap-to-move: tap ⋮ (or Move) to lift a session, then tap the day it goes to. ──
let MOVE=null;
function dropOk(j){
  if(!MOVE)return {ok:false};

  if(pauseAt(dayDate(j)))return {ok:false,why:'paused'};

}

// ══ SESSION LOGGING ══
// Writes into ST.sessions / ST.runs in exactly the shape migrateFromV1 produces,
// plus sid/ctx/pattern/match so a session can be found again and so Progress can
// tell variants apart. Day keys always come from localDateStr.
let LOG=null;
function logKey(ds,sid){ return ds+'|'+(sid||''); }
function findLog(ds,sid){ return ST.sessions.filter(s=>s&&s.date===ds&&s.sid===sid)[0]||null; }
function isRun(sid){ return !!(SESSIONS[sid]&&SESSIONS[sid].kind==='run'); }
function findRunLog(ds,sid){ return ST.runs.filter(r=>r&&r.date===ds&&r.sid===sid)[0]||null; }
function logFor(ds,sid){ return isRun(sid)?(findRunLog(ds,sid)||findLog(ds,sid)):findLog(ds,sid); }
function hasDraft(ds,sid){ return !!ST.drafts[logKey(ds,sid)]; }
// '4 × 4–6 @ RPE 8' -> 4 sets of 4.  '5 rounds × 6' -> 5 sets of 6.
function schemeSets(sc){
  const m=String(sc||'').match(/(\d+)\s*(?:rounds)?\s*×\s*(\d+)/);
  if(!m)return {n:3,reps:8};
  return {n:Math.min(8,Math.max(1,parseInt(m[1]))),reps:parseInt(m[2])};
}
// ── Double progression: hit the TOP of the range on every set -> add load. ──
function repRange(sc){ const m=String(sc||'').match(/×\s*(\d+)(?:\s*[–-]\s*(\d+))?/); if(!m)return null;
  const lo=parseInt(m[1]); return {lo:lo,hi:m[2]?parseInt(m[2]):lo}; }
function stepFor(name,pattern,unit){
  const db=/\bDB\b|dumbbell|goblet|kettlebell/i.test(name), lat=/lateral/i.test(name), lower=pattern==='squat'||pattern==='hinge';
  if(unit==='lb')return lat?2.5:db?5:lower?10:5;
  return lat?1:db?2:lower?5:2.5;
}
// {kind:'add'|'same'|'repeat'|'harder', text, next:display weight or null}
function progressCue(name,pattern,scheme,unit,skipKey){
  const last=lastExLog(name,skipKey), r=repRange(scheme);
  if(!last||!r)return null;
  const sets=last.sets.filter(t=>(parseInt(t.reps)||0)>0); if(!sets.length)return null;
  const reps=sets.map(t=>parseInt(t.reps)||0), top=Math.max.apply(null,sets.map(t=>parseFloat(t.kg)||0));
  if(top<=0)return reps.every(x=>x>=r.hi)?{kind:'harder',text:'Top of the range on every set — make it harder: add a pack, slow it down, or the next variation.',next:null}
    :{kind:'same',text:'Aim to beat last time on reps.',next:null};
  if(reps.every(x=>x>=r.hi)){ const step=stepFor(name,pattern,unit), cur=parseFloat(toDisp(top,unit));
    return {kind:'add',text:'↑ Add '+step+unit+' — you hit '+r.hi+'+ reps on every set last time.',next:String(Math.round((cur+step)*2)/2)}; }
  if(reps.some(x=>x<r.lo))return {kind:'repeat',text:'Repeat this weight — last time fell short of '+r.lo+' reps.',next:null};
  return {kind:'same',text:'Same weight — beat last time on reps.',next:null};
}
function freshLog(s,ds,sid,ctxId){
  const cw=condWorkout(sid,parseD(ds));
  if(cw)return {ds:ds,sid:sid,ctx:ctxId,kind:'cond',notes:'',ex:[],km:'',mins:'',secs:'',
    fin:{kind:cw.kind,of:cw.of||null,score:'',reps:'',note:''}};
  const L={ds:ds,sid:sid,ctx:ctxId,kind:s.kind,notes:'',ex:[],fin:null,km:'',mins:'',secs:'',unit:ST.unit||'kg'};
  if(s.kind==='strength'){
    const sc=schemeFor(s,ctxId,parseD(ds)), ss=schemeSets(sc);
    L.ex=s.patterns.map(p=>{
      const v=exFor(p,ctxId,parseD(ds)), last=lastExLog(v.name), sets=[];
      const n=last&&last.sets.length?last.sets.length:ss.n;
      for(let j=0;j<n;j++){
        const ls=last&&last.sets[j];
        sets.push({reps:ls&&ls.reps?String(ls.reps):String(ss.reps),kg:ls&&ls.kg?toDisp(ls.kg,L.unit):''});
      }

// Clock runs off the wall clock, not tick counting, so a locked phone does not drift it.
function toggleBenchClock(){

    if(left<=0){ stopBenchClock(); paintBenchClock(0); toast('Time — enter your score');
      if(navigator.vibrate)navigator.vibrate([400,150,400]); return; }

function saveLeg(){
  const L=LEG, place=String(L.place||'').trim(), D=/^\d{4}-\d{2}-\d{2}$/;
  if(!place){ toast('Give the leg a name'); return; }
  if(!D.test(L.from)||(!L.open&&!D.test(L.to))){ toast('Pick both dates'); return; }
  let to=L.open?'':L.to;
  if(to&&to<L.from){ toast('The end date is before the start'); return; }
  // Work on a copy; nothing is saved unless every check passes.
  const trip=ST.trip.map(o=>Object.assign({},o));
  let at=L.i;
  if(L.moved&&!ST.tripReal)trip.length=0;   // first real leg replaces the example trip
  if(L.moved){
    const today=L.from, yest=localDateStr(addDays(parseD(today),-1));
    const ci=trip.findIndex(x=>x.from<=today&&today<=legTo(x));
    if(ci>-1){ if(trip[ci].from>=today)trip.splice(ci,1); else trip[ci].to=yest; }
    // a leg you had already planned for later stays; the new one stops the day before it
    const next=trip.filter(x=>x.from>today).sort((a,b)=>a.from<b.from?-1:1)[0];
    if(next)to=localDateStr(addDays(parseD(next.from),-1));
    at=-1;
  }
  const end=to||OPEN_END;
  const clash=trip.filter((x,j)=>j!==at&&x.from<=end&&L.from<=legTo(x))[0];
  if(clash){ toast('Overlaps '+clash.place+' ('+dShort(clash.from)+' – '+(clash.to?dShort(clash.to):'open')+')'); return; }
  const rec={place:place,from:L.from,to:to,ctx:L.ctx,focus:String(L.focus||'').trim()};
  if(L.lifts!=='')rec.lifts=parseInt(L.lifts);
  if(L.runs!=='')rec.runs=parseInt(L.runs);
  if(THIRD_OPTS.indexOf(L.third)>-1)rec.third=L.third;
  const mk=(L.missing||[]).filter(k=>(CTX_KIT[L.ctx]||[]).indexOf(k)>-1); if(mk.length)rec.missing=mk;
  if(at>-1)trip[at]=rec; else trip.push(rec);
  ST.trip.splice.apply(ST.trip,[0,ST.trip.length].concat(trip));
  ST.tripReal=true; sortTrip(); save(); LEG=null; closeSheet(); renderAll();
  toast(L.moved?'Welcome to '+place:place+' saved');
}
function deleteLeg(i){
  const s=ST.trip[i]; if(!s)return;
  if(!confirm('Delete '+s.place+'?'))return;
  ST.trip.splice(i,1); ST.tripReal=true; sortTrip(); save(); LEG=null; closeSheet(); renderAll();
  toast(s.place+' deleted');
}
function clearTrip(){
  if(!confirm('Remove every leg and start your trip from scratch?'))return;
  ST.trip.splice(0,ST.trip.length); ST.tripReal=true; sortTrip(); save(); renderAll();
  toast('Trip cleared — add your first leg');
}

// ══ BODY CHECK-IN — weekly weight and waist ══
// Leaner is the goal, so it gets measured. Scales differ between gyms, so the

let BODY=null;
function bodySorted(){ return ST.body.filter(b=>b&&b.date).slice().sort((a,b)=>a.date<b.date?-1:1); }
function bodyDue(){ const k=localDateStr(mondayOf(new Date())); return !ST.body.some(b=>b&&b.date>=k); }
function openBody(ds){
  ds=ds||localDateStr(new Date());

  BODY={ds:ds,kg:x&&x.kg?String(x.kg):'',waist:x&&x.waist?String(x.waist):'',edit:!!x,last:last||null};
  renderBody(); document.getElementById('sheet').classList.add('open');
}
function bodyIn(f,el){ BODY[f]=el.value; }
function renderBody(){
  const B=BODY;
  document.getElementById('sheetBody').innerHTML='<div class="sheet-grab"></div>'+
    '<div class="sheet-t">Weekly check-in</div>'+
    '<div class="sheet-s">Same conditions each week: morning, after the loo, before food. Waist at the belly button, relaxed.</div>'+
    '<div class="lgex"><div class="lglab" style="grid-template-columns:1fr 1fr;margin-top:0;"><div>Weight kg</div><div>Waist cm</div></div>'+
      '<div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px;">'+
      '<input class="lgi" type="number" inputmode="decimal" step=".1" value="'+esc(B.kg)+'" placeholder="kg" oninput="bodyIn(\'kg\',this)">'+
      '<input class="lgi" type="number" inputmode="decimal" step=".5" value="'+esc(B.waist)+'" placeholder="cm" oninput="bodyIn(\'waist\',this)"></div>'+
      '<div class="lg-last">'+(B.last&&B.last.date!==B.ds?'Last time '+(B.last.kg?B.last.kg+'kg':'')+(B.last.kg&&B.last.waist?' · ':'')+(B.last.waist?B.last.waist+'cm':'')+' · '+dShort(B.last.date):'Either one on its own is fine.')+'</div>'+
      '<div class="lglab" style="grid-template-columns:1fr;"><div style="text-align:left;">Date</div></div>'+
      '<input class="lgi" type="date" value="'+esc(B.ds)+'" max="'+localDateStr(new Date())+'" onchange="if(this.value)BODY.ds=this.value"></div>'+

    '<button class="btn btn-p" onclick="saveBody()">Save check-in</button>'+
    '<button class="btn btn-g" style="margin-top:8px;" onclick="closeSheet()">Cancel</button>';
}
function saveBody(){
  const B=BODY, kg=parseFloat(B.kg)||0, w=parseFloat(B.waist)||0;
  if(!kg&&!w){ toast('Enter weight, waist or both'); return; }
  if(kg&&(kg<30||kg>250)){ toast('That weight looks off — check the units'); return; }
  if(w&&(w<40||w>200)){ toast('That waist looks off — centimetres'); return; }
  const rec={date:B.ds}; if(kg)rec.kg=Math.round(kg*10)/10; if(w)rec.waist=Math.round(w*2)/2;
  const old=ST.body.filter(b=>b&&b.date===B.ds)[0];
  if(old)ST.body[ST.body.indexOf(old)]=rec; else ST.body.push(rec);
  save(); BODY=null; closeSheet(); renderAll(); toast('Check-in saved');
}
function deleteBody(ds){
  if(!confirm('Delete the check-in from '+dShort(ds)+'?'))return;
  ST.body=ST.body.filter(b=>!(b&&b.date===ds)); save(); renderAll(); toast('Check-in deleted');
}
// Change over roughly four weeks: latest vs the entry nearest 28 days before it.
function bodyTrend(field){
  const pts=bodySorted().filter(b=>b[field]); if(pts.length<2)return null;
  const last=pts[pts.length-1], target=addDays(parseD(last.date),-28);
  let base=pts[0]; pts.forEach(p=>{ if(Math.abs(parseD(p.date)-target)<Math.abs(parseD(base.date)-target)&&p!==last)base=p; });
  const wks=Math.max(1,daysBetween(parseD(base.date),parseD(last.date))/7);
  return {now:last[field],from:base[field],fromDate:base.date,wks:wks,perWk:(last[field]-base[field])/wks};
}
function bodyRead(){
  const k=bodyTrend('kg'), w=bodyTrend('waist');
  if(!k&&!w)return 'Two check-ins and REPS can tell you which way things are going.';
  const out=[];
  if(w)out.push(w.perWk<-0.1?'Waist down '+Math.abs(w.now-w.from).toFixed(1)+'cm since '+dShort(w.fromDate)+' — you are getting leaner.'
    :w.perWk>0.1?'Waist up '+(w.now-w.from).toFixed(1)+'cm since '+dShort(w.fromDate)+'.':'Waist holding steady.');
  if(k){ const pct=k.perWk/k.from*100;
    out.push(pct<-1?'Weight dropping '+Math.abs(pct).toFixed(1)+'% a week — faster than the ~0.5–1% that protects muscle. Eat a bit more, keep protein high.'
      :pct<=-0.4?'Weight down '+Math.abs(pct).toFixed(1)+'% a week — right in the range that keeps your muscle.'
      :pct<0.2?'Weight about flat.'+(w&&w.perWk<-0.1?' With your waist coming down, that usually means muscle up, fat down.':'')
      :'Weight going up '+pct.toFixed(1)+'% a week.'); }
  return out.join(' ');
}

    '<div class="sub">Weight and waist — thirty seconds, once a week.</div></div>'+
    '<button class="btn btn-p" style="width:auto;padding:10px 16px;" onclick="openBody()">Check in</button></div>';
}

  const B=bodySorted(), kg=B.filter(b=>b.kg), wa=B.filter(b=>b.waist);
  const row=(lab,arr,f,unit)=>{ if(!arr.length)return ''; const v=arr.map(b=>b[f]), cur=v[v.length-1];

// ══ BACKUP — export / import of the whole ST object ══
// Same envelope idea as v1 (app:'REPS'), but v:2 and its own filename. A v1
// backup is refused here: its shape is different and would break v2. (v1
// already refuses a v2 file, because it has no check-ins list.)
const BACKUP_APP='REPS', BACKUP_V=2;
let PENDING=null;
function isObj(v){ return v!==null&&typeof v==='object'&&!Array.isArray(v); }
function exportData(){
  try{
    const stamp=localDateStr(new Date());
    const json=JSON.stringify({app:BACKUP_APP,v:BACKUP_V,exportedAt:stamp,data:ST},null,2);
    const name='reps-v2-backup-'+stamp+'.json';
    const blob=new Blob([json],{type:'application/json'});
    const done=()=>{ ST.lastBackup=stamp; save(); renderAll(); toast('Backup exported'); };
    // iOS Home Screen apps ignore <a download>, so hand the file to the share sheet
    if(typeof File==='function'&&navigator.canShare){
      const file=new File([blob],name,{type:'application/json'});
      if(navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:name}).then(done).catch(err=>{
          if(err&&err.name==='AbortError')return;
          downloadBlob(blob,name); done(); });
        return;
      }
    }
    downloadBlob(blob,name); done();
  }catch(e){ toast('Export failed: '+e.message); }
}
function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function triggerImport(){ const inp=document.getElementById('importFile'); if(!inp)return; inp.value=''; inp.click(); }
function handleImportFile(e){
  const file=e.target.files&&e.target.files[0]; if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    let parsed; try{ parsed=JSON.parse(r.result); }catch(err){ toast('That file is not valid JSON'); return; }
    const c=validateBackup(parsed);
    if(!c.ok){ toast(c.reason); return; }
    PENDING={data:c.data,fileName:file.name,exportedAt:c.exportedAt,v1:!!c.v1};
    openImportConfirm();
  };
  r.onerror=()=>toast('Could not read that file');
  r.readAsText(file);
}
// {ok:true,data,exportedAt} or {ok:false,reason}. Nothing touches ST until this
// passes AND the user confirms.
function validateBackup(p){
  if(!isObj(p))return {ok:false,reason:'That file is not a REPS backup'};
  let d=p, at='';
  let v1=false;
  if(p.app===BACKUP_APP&&isObj(p.data)){
    v1=p.v!==BACKUP_V;
    d=p.data; if(typeof p.exportedAt==='string')at=p.exportedAt;
  }
  // A v1 file is never restored over v2 — its history is offered as a merge.
  if(v1||Array.isArray(d.checkins)||typeof d.startDate==='string'){
    if(!Array.isArray(d.sessions))return {ok:false,reason:'That v1 backup has no sessions list'};
    for(let i=0;i<d.sessions.length;i++){ const s=d.sessions[i];
      if(!isObj(s)||typeof s.date!=='string'||typeof s.type!=='string')return {ok:false,reason:'v1 backup session '+(i+1)+' looks wrong'}; }
    return {ok:true,v1:true,data:d,exportedAt:at};
  }
  if(!Array.isArray(d.sessions))return {ok:false,reason:'Backup is missing its sessions list'};
  for(let i=0;i<d.sessions.length;i++){ const s=d.sessions[i];
    if(!isObj(s)||typeof s.date!=='string'||!Array.isArray(s.exercises))return {ok:false,reason:'Backup session '+(i+1)+' looks wrong'}; }
  const arrs=['runs','benchmarks','trip','races','body','pauses'];
  for(let i=0;i<arrs.length;i++){ const k=arrs[i]; if(d[k]!==undefined&&!Array.isArray(d[k]))return {ok:false,reason:'Backup field '+k+' looks wrong'}; }
  if(Array.isArray(d.trip))for(let i=0;i<d.trip.length;i++){ const t=d.trip[i];
    if(!isObj(t)||!/^\d{4}-\d{2}-\d{2}$/.test(t.from)||(t.to&&!/^\d{4}-\d{2}-\d{2}$/.test(t.to))||!CONTEXTS[t.ctx])
      return {ok:false,reason:'Backup trip leg '+(i+1)+' looks wrong'}; }
  if(Array.isArray(d.races))for(let i=0;i<d.races.length;i++){ const r=d.races[i];
    if(!isObj(r)||typeof r.name!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(r.date))return {ok:false,reason:'Backup race '+(i+1)+' looks wrong'}; }
  const objs=['pins','dayCtx','drafts','skips','runSub'];
  for(let i=0;i<objs.length;i++){ const k=objs[i]; if(d[k]!==undefined&&!isObj(d[k]))return {ok:false,reason:'Backup field '+k+' looks wrong'}; }
  // ergPRs: only the four erg keys, ever
  if(d.ergPRs!==undefined){
    if(!isObj(d.ergPRs))return {ok:false,reason:'Backup erg PRs look wrong'};
    const ok4=['row1k','row2k','skiErg1k','skiErg2k'], ks=Object.keys(d.ergPRs);
    for(let i=0;i<ks.length;i++)if(ok4.indexOf(ks[i])===-1)return {ok:false,reason:'Backup erg PRs contain an unexpected field: '+ks[i]};
  }
  return {ok:true,data:d,exportedAt:at};
}
// What a v1 file would add: only entries v2 does not already hold.
function liftSig(s){ return s.date+'|'+(s.exercises||[]).map(e=>e.name+':'+(e.sets||[]).length).join(','); }
function v1Additions(old){
  const m=mapV1(old), haveL={}, haveR={};
  ST.sessions.forEach(s=>{ if(s)haveL[liftSig(s)]=1; });
  ST.runs.forEach(r=>{ if(r)haveR[r.date+'|'+(parseFloat(r.km)||0)]=1; });
  const lifts=m.lifts.filter(s=>!haveL[liftSig(s)]), runs=m.runs.filter(r=>!haveR[r.date+'|'+r.km]);
  const erg={}; Object.keys(m.erg).forEach(k=>{ if(!ST.ergPRs[k])erg[k]=m.erg[k]; });
  return {lifts:lifts,runs:runs,erg:erg,totalL:m.lifts.length,totalR:m.runs.length};
}
function openImportConfirm(){
  if(PENDING.v1)return openV1Confirm();
  const d=PENDING.data, n=(x,w)=>'<strong>'+x+'</strong> '+w+(x===1?'':'s');
  const legs=Array.isArray(d.trip)?d.trip.length:0;
  document.getElementById('sheetBody').innerHTML='<div class="sheet-grab"></div>'+
    '<div class="sheet-t">Replace all v2 data?</div>'+
    '<div class="sheet-s">This overwrites everything in v2 and cannot be undone. Your v1 app is not touched.</div>'+
    '<div class="card"><div class="logged-b" style="margin:0;">'+
      '<div><strong>'+esc(PENDING.fileName)+'</strong>'+(PENDING.exportedAt?' — exported '+esc(dShort(PENDING.exportedAt))+' '+esc(PENDING.exportedAt.slice(0,4)):'')+'</div>'+
      '<div style="margin-top:6px;">Contains '+n(d.sessions.length,'lift session')+', '+n((d.runs||[]).length,'run')+', '+
        n((d.benchmarks||[]).length,'benchmark test')+' and '+n(legs,'trip leg')+'.</div>'+
      '<div style="margin-top:6px;">You currently have '+n(ST.sessions.length,'lift session')+', '+n(ST.runs.length,'run')+', '+
        n(ST.benchmarks.length,'benchmark test')+' and '+n(ST.trip.length,'trip leg')+'.</div></div></div>'+
    '<button class="btn btn-p" onclick="applyImport()">Replace my v2 data</button>'+
    '<button class="btn btn-g" style="margin-top:8px;" onclick="PENDING=null;closeSheet()">Cancel</button>';
  document.getElementById('sheet').classList.add('open');
}
function openV1Confirm(){
  const a=v1Additions(PENDING.data), n=(x,w)=>'<strong>'+x+'</strong> '+w+(x===1?'':'s'), nothing=!a.lifts.length&&!a.runs.length&&!Object.keys(a.erg).length;
  document.getElementById('sheetBody').innerHTML='<div class="sheet-grab"></div>'+
    '<div class="sheet-t">Add history from v1</div>'+
    '<div class="sheet-s">This is a backup from your v1 app. Nothing in v2 is replaced — only history v2 does not already have is added. v1 itself is not touched.</div>'+
    '<div class="card"><div class="logged-b" style="margin:0;">'+
      '<div><strong>'+esc(PENDING.fileName)+'</strong></div>'+
      '<div style="margin-top:6px;">It holds '+n(a.totalL,'lift session')+' and '+n(a.totalR,'run')+'.</div>'+
      '<div style="margin-top:6px;">'+(nothing?'v2 already has all of it.':'New to v2: '+n(a.lifts.length,'lift session')+' and '+n(a.runs.length,'run')+
        (Object.keys(a.erg).length?', plus '+Object.keys(a.erg).length+' erg time'+(Object.keys(a.erg).length===1?'':'s'):'')+'.')+'</div></div></div>'+
    (nothing?'':'<button class="btn btn-p" onclick="applyV1Merge()">Add them to v2</button>')+
    '<button class="btn btn-g" style="margin-top:8px;" onclick="PENDING=null;closeSheet()">'+(nothing?'Close':'Cancel')+'</button>';
  document.getElementById('sheet').classList.add('open');
}
function applyV1Merge(){
  if(!PENDING||!PENDING.v1)return;
  const a=v1Additions(PENDING.data);
  a.lifts.forEach(x=>ST.sessions.push(x)); a.runs.forEach(x=>ST.runs.push(x));
  Object.keys(a.erg).forEach(k=>{ ST.ergPRs[k]=a.erg[k]; });
  const c=ST.importedCounts||{lifts:0,runs:0};
  ST.importedCounts={lifts:(c.lifts||0)+a.lifts.length,runs:(c.runs||0)+a.runs.length};
  if(!ST.importedFrom)ST.importedFrom='v1 backup file';
  PENDING=null; save(); closeSheet(); renderAll();
  toast('Added '+a.lifts.length+' lift sessions and '+a.runs.length+' runs from v1');
}
function applyImport(){
  if(!PENDING||PENDING.v1)return;
  try{
    ST=PENDING.data;
    ensureState();
    // A restored backup must never pull v1 history in again on next load —
    // that would duplicate every imported session.
    ST.migrated=true;
    migratePlan();
    TRIP=ST.trip; LOG=null; PENDING=null; WEEK_OFFSET=0;
    save(); closeSheet(); renderAll();
    toast('Backup restored');
  }catch(e){ toast('Import failed: '+e.message); }
}
function backupCard(){
  const n=ST.sessions.filter(s=>s&&s.sid).length+ST.runs.filter(r=>r&&r.sid).length+ST.benchmarks.length;
  const last=ST.lastBackup, stale=n>0&&(!last||daysBetween(parseD(last),new Date())>=30);
  return '<div class="card-lg"><div class="chd"><div><div class="ctitle">Data and backup</div>'+
    '<div class="sub">Everything in v2 lives only on this phone. Export saves it to a dated file — choose Save to Files to keep it in iCloud Drive.</div></div></div>'+
    (stale?'<div class="warn">'+(last?'Last backup '+dShort(last)+'. ':'No backup yet. ')+'You have '+n+(n===1?' entry':' entries')+' logged in v2 that only exist here.</div>'
      :last?'<div class="ex-note" style="margin-bottom:10px;">Last backup '+dShort(last)+' '+last.slice(0,4)+'.</div>':'')+
    '<button class="btn" onclick="exportData()">Export backup</button>'+
    '<button class="btn btn-g" style="margin-top:8px;" onclick="triggerImport()">Restore from a backup</button>'+
    '<div class="ex-note" style="margin-top:8px;">A v1 backup file works here too: its history is added, nothing is replaced.</div>'+
    '<input type="file" id="importFile" accept=".json,application/json" style="display:none;" onchange="handleImportFile(event)"></div>';

// ══ PROGRESS DETAIL ══
// Single-series line chart: 2px line, visible markers, faint min/max guides,
// tap a point to read it (the phone version of a hover tooltip).
let CHART=null, PROG_NAMES=[], ENTRIES=[];
function lineChart(pts,col,unit){
  if(pts.length<2)return '';
  const W=320,H=150,L=50,R=10,T=12,B=22;
  const vs=pts.map(p=>p.v), mn=Math.min.apply(null,vs), mx=Math.max.apply(null,vs);
  const pad=(mx-mn)*0.18||Math.max(1,mx*0.05), lo=mn-pad, hi=mx+pad;
  const ts=pts.map(p=>parseD(p.d).getTime()), t0=ts[0], span=(ts[ts.length-1]-t0)||1;
  const X=i=>L+(ts[i]-t0)/span*(W-L-R), Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  CHART={pts:pts,unit:unit,xy:pts.map((p,i)=>[X(i),Y(p.v)])};
  // labels live in their own left gutter, so the line can never run through them
  const guide=(v,lab)=>'<line x1="'+(L-6)+'" x2="'+W+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--cream3)" stroke-width="1" stroke-dasharray="3 3"/>'+
    '<text x="'+(L-10)+'" y="'+(Y(v)+3).toFixed(1)+'" font-size="9" font-weight="700" fill="var(--ink3)" text-anchor="end">'+lab+'</text>';
  const first=parseD(pts[0].d), last=parseD(pts[pts.length-1].d);
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block;overflow:visible;touch-action:manipulation;">'+
    guide(mx,mx+unit)+(mn!==mx?guide(mn,mn+unit):'')+
    '<polyline points="'+CHART.xy.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
    CHART.xy.map(p=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4" fill="'+col+'" stroke="var(--white)" stroke-width="2"/>').join('')+
    '<circle id="chartHi" r="7" fill="none" stroke="'+col+'" stroke-width="2" cx="'+CHART.xy[CHART.xy.length-1][0].toFixed(1)+'" cy="'+CHART.xy[CHART.xy.length-1][1].toFixed(1)+'"/>'+
    CHART.xy.map((p,i)=>'<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="15" fill="transparent" onclick="chartPick('+i+')" style="cursor:pointer;"/>').join('')+
    '<text x="'+L+'" y="'+(H-4)+'" font-size="9" fill="var(--ink3)">'+first.getDate()+' '+MONTHS[first.getMonth()]+' '+String(first.getFullYear()).slice(2)+'</text>'+
    '<text x="'+(W-R)+'" y="'+(H-4)+'" font-size="9" fill="var(--ink3)" text-anchor="end">'+last.getDate()+' '+MONTHS[last.getMonth()]+' '+String(last.getFullYear()).slice(2)+'</text>'+
    '</svg>';
}
function chartRead(i){ const p=CHART.pts[i]; return dShort(p.d)+' '+String(parseD(p.d).getFullYear())+' · '+p.v+CHART.unit+' est. 1RM'; }
function chartPick(i){
  if(!CHART)return;
  const hi=document.getElementById('chartHi'), rd=document.getElementById('chartRead');
  if(hi){ hi.setAttribute('cx',CHART.xy[i][0].toFixed(1)); hi.setAttribute('cy',CHART.xy[i][1].toFixed(1)); }
  if(rd)rd.textContent=chartRead(i);
}
function openLift(idx){
  const name=PROG_NAMES[idx]; if(!name)return;
  const pts=exSeries(name,true), hist=liftHistory(name);
  const pat=ANCHORS.filter(k=>patternNames(k).indexOf(name)>-1)[0];
  const canon=pat&&ANCHOR_CANON[pat]===name;
  let best=null; pts.forEach(p=>{ if(!best||p.v>best.v)best=p; });
  const stat=(l,v,s)=>'<div class="st"><div class="st-l">'+l+'</div><div class="st-v">'+v+'</div><div class="st-d" style="color:var(--ink3);">'+(s||'')+'</div></div>';
  let h='<div class="sheet-grab"></div><div class="sheet-t">'+esc(name)+'</div>'+
    '<div class="sheet-s">'+(pat?PATTERNS[pat].label+' pattern · '+(canon?'headline lift':'variant, tracked on its own line'):'Logged exercise')+'</div>';
  if(pts.length){
    h+='<div class="strip">'+stat('Best',best.v+'kg',dShort(best.d))+stat('Latest',pts[pts.length-1].v+'kg',dShort(pts[pts.length-1].d))+
      stat('Sessions',String(hist.length),pts.length>1?delta(pts[pts.length-1].v,pts[0].v,'kg'):'')+'</div>';
    if(pts.length>1)h+='<div class="card"><div class="ctitle">Estimated 1RM</div>'+
      '<div id="chartRead" style="font-size:12px;font-weight:700;color:var(--ink2);margin:4px 0 10px;"></div>'+
      lineChart(pts,'var(--green)','kg')+'<div class="ex-note" style="margin-top:6px;">Tap a point to read it.</div></div>';

// Recent activity across lifts, runs and benchmark tests, newest first.
function recentEntries(n){
  const out=[];
  ST.sessions.forEach(s=>{ if(s&&s.date&&((s.exercises||[]).length||s.finisher&&s.sid))out.push({kind:'lift',date:s.date,ref:s}); });
  ST.runs.forEach(r=>{ if(r&&r.date)out.push({kind:'run',date:r.date,ref:r}); });
  ST.benchmarks.forEach(b=>{ if(b&&b.date)out.push({kind:'bench',date:b.date,ref:b}); });
  return out.sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0).slice(0,n);
}
function entryLabel(e){
  if(e.kind==='bench')return 'Benchmark';

  return e.ref.sid&&SESSIONS[e.ref.sid]?SESSIONS[e.ref.sid].label:'Lift session';

function entryLine(e){

        // History for THIS exercise, not the pattern — comparing like with like.

        else if(lg) prog='<div class="prog"><span class="prog-v">Last time '+esc(setsSummary(lg.sets))+' · '+dShort(lg.date)+'</span></div>';
        else prog='<div class="prog"><span class="prog-v" style="color:var(--ink4);">'+
          (isA?'No history for this lift yet — log it to start the trend':'Not logged before')+'</span></div>';

          '<div class="ex-name">'+esc(v.name)+' '+tag+'</div><div class="ex-scheme">'+esc(scheme)+'</div>'+
          '<div class="ex-note">'+esc(v.note)+'</div>'+

        '<div class="fin-why">'+esc(f.why)+'</div></div>';

  } else {

  const P=PAUSE, today=localDateStr(new Date());

  ST.pauses=ST.pauses.filter(p=>!(p.from<=today&&today<=(p.to||OPEN_END)));
  ST.pauses.push({from:today,to:P.open?'':P.to,why:P.why});
  save(); PAUSE=null; closeSheet(); renderAll(); toast(P.why==='ill'?'Paused. Rest up.':'Paused');

  const today=localDateStr(new Date()), yest=localDateStr(addDays(new Date(),-1));
  ST.pauses.forEach(p=>{ if(p.from<=today&&today<=(p.to||OPEN_END))p.to=yest; });

      '<div class="wd-day"><div class="wd-dow">'+DOW[i]+'</div><div class="wd-num">'+d.getDate()+'</div></div>'+
      '<div class="wd-body"><div class="wd-title">'+(s?esc(slotLabel(slot,d)):pauseAt(d)?'Paused':'Rest')+
        (done?' <span class="tick">✓ logged</span>':s&&hasDraft(ds,slot.id)?' <span class="draft">draft</span>':'')+
        (s&&s.core?' <span class="core">core</span>':'')+
        (slot&&slot.slid?' <span class="moved">from '+DOW[slot.from]+'</span>':'')+
        (slot&&slot.pinned?' <span class="pin">moved</span>':'')+'</div>'+
        '<div class="wd-meta">'+(moveMeta?'<span style="color:var(--accent);font-weight:700;">'+moveMeta+'</span>'
          :bad?'<span style="color:var(--amber);font-weight:700;">No kit here — use ⋮ to move it</span>':esc(meta))+'</div></div>'+
      '<div class="wd-ctx" style="background:'+c.bg+';color:'+c.color+';">'+c.icon+'</div>'+
      '<div class="wd-grip'+(canGrip?'':' off')+'" '+(canGrip?'onclick="event.stopPropagation();startMove('+i+')" title="Move"':'')+'>⋮</div></div>'; }).join('');
  const sk=skipped();
  const ws=weekStart(), we=addDays(ws,6);
  document.getElementById('pg-week').innerHTML=
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">'+
      '<button class="btn btn-g" style="width:auto;padding:8px 14px;" onclick="shiftWeek(-1)">←</button>'+
      '<div style="flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--ink2);">'+
        ws.getDate()+' '+MONTHS[ws.getMonth()]+' – '+we.getDate()+' '+MONTHS[we.getMonth()]+'</div>'+
      '<button class="btn btn-g" style="width:auto;padding:8px 14px;" onclick="shiftWeek(1)">→</button></div>'+
    (MOVE?'<div class="movebar">Moving '+esc(SESSIONS[MOVE.id].label)+' — tap a day<button onclick="cancelMove()">Cancel</button></div>'
      :'<div class="note">Tap a day to see the session. Tap <strong>⋮</strong> to move it, then tap the day it goes to.</div>')+
    '<div class="wk">'+rows+'</div>'+renderUnplaced(unplaced)+
    (sk.length?'<div class="card"><div class="ctitle" style="margin-bottom:7px;">Skipped this week</div>'+
      sk.map(id=>'<div class="ex" style="padding:7px 0;align-items:center;"><div class="ex-body"><div class="ex-name" style="font-size:13px;">'+esc(SESSIONS[id].label)+'</div></div>'+
        '<button class="chip" onclick="unskip(\''+id+'\')">Undo</button></div>').join('')+'</div>':'')+
    (isManual()||sk.length?'<button class="btn btn-g" style="margin-top:10px;" onclick="resetWeek()">↺ Reset to automatic</button>':'')+
    '<div class="divider">The written week</div><div class="card">'+
      (function(){ const w=weekShape(); return '<div class="ex-note" style="margin:0 0 8px;">'+w.lifts+(w.lifts===1?' lift':' lifts')+' and '+w.runs+(w.runs===1?' run':' runs')+' — '+
        (w.leg&&(w.leg.lifts||w.leg.runs!==undefined&&w.leg.runs!=='')?'set on '+esc(w.leg.place):esc(w.phase.label)+' default')+'. Change it on the Trip tab.</div>'+
        (w.lifts>=3?'<div class="note" style="margin-bottom:10px;">Third lift: <strong>'+esc(SESSIONS[w.third].label)+'</strong>'+
          (w.auto?' — recommended. '+esc(w.rec.why):' — you chose this'+(w.rec.id!==w.third?'. REPS would pick '+esc(SESSIONS[w.rec.id].label)+': '+esc(w.rec.why):'.'))+'</div>':''); })()+
      '<div style="font-size:12px;color:var(--ink2);line-height:1.7;">'+
      (function(){ const I=planIdeal(); return weekPlan().slice().sort((a,b)=>I[a]-I[b]).map(id=>DOW[I[id]]+' — '+esc(SESSIONS[id].label)+(SESSIONS[id].core?' (core)':'')).join('<br>'); })()+'</div>'+
      '<div class="ex-note" style="margin-top:9px;">Two full-body sessions rather than a split: miss a day on a split and you lose a whole muscle group — miss a full-body day and you lose a third of the week.</div></div>';
}
function shiftWeek(n){ MOVE=null; WEEK_OFFSET+=n; renderAll(); }
function toggleRope(){ ST.rope=ST.rope===false; save(); renderAll(); toast(ST.rope?'Rope sessions on':'Rope sessions off'); }
function toggleRunna(){ ST.runna=!ST.runna; save(); renderAll(); toast(ST.runna?'Runs now point to Runna':'REPS suggests each run again'); }
function renderTrip(){
  const now=new Date();
  document.getElementById('pg-trip').innerHTML=
    '<div class="note">Blocks are four weeks: three building, the fourth lighter if you need it. The block <em>type</em> comes from the equipment on that leg — not a 24-week arc you would abandon halfway.</div>'+
    '<div class="card"><div class="chd" style="margin-bottom:0;align-items:center;"><div style="min-width:0;"><div class="ctitle">Running plan</div>'+
      '<div class="sub">'+(ST.runna?'Runna sets your runs. REPS keeps the week, the lifting and the log.':'REPS suggests each run. Switch on if Runna is planning your runs.')+'</div></div>'+
      '<button class="chip'+(ST.runna?' active':'')+'" onclick="toggleRunna()">'+(ST.runna?'Runna on':'Runna off')+'</button></div></div>'+
    '<div class="card"><div class="chd" style="margin-bottom:0;align-items:center;"><div style="min-width:0;"><div class="ctitle">Skipping rope</div>'+
      '<div class="sub">'+(ST.rope!==false?'You carry one. Travel days get a rope + bodyweight session, and it is an option everywhere.':'Switch on if you carry a skipping rope.')+'</div></div>'+
      '<button class="chip'+(ST.rope!==false?' active':'')+'" onclick="toggleRope()">'+(ST.rope!==false?'Rope on':'Rope off')+'</button></div></div>'+
    '<div class="divider">Races</div>'+racesList()+
    '<div class="divider">Phases</div>'+
    phases().map(p=>{ const f=parseD(p.from),t=parseD(p.to),isNow=inSpan(now,p.from,p.to);
      const fs=f.getDate()+' '+MONTHS[f.getMonth()]+' '+f.getFullYear(), ts=t.getDate()+' '+MONTHS[t.getMonth()]+' '+t.getFullYear();
      const when=p.from===FAR_PAST&&p.to===FAR_FUTURE?'Ongoing':p.from===FAR_PAST?'Until '+ts:p.to===FAR_FUTURE?'From '+fs:fs+' – '+ts;
      return '<div class="phase" style="background:'+p.bg+';color:'+p.fg+';'+(isNow?'':'opacity:.5;')+'">'+
        '<div class="phase-l">'+when+(isNow?' · now':'')+'</div>'+
        '<div class="phase-n">'+esc(p.label)+'</div><div class="phase-d">'+p.desc+'</div></div>'; }).join('')+
    '<div class="divider">Legs</div>'+
    '<button class="act" onclick="openMoved()"><span class="ai">📍</span><span>I have moved on<small>'+
      (currentSeg()?'Ends '+esc(currentSeg().place)+' yesterday and starts somewhere new today':'Start a leg from today')+'</small></span></button>'+
    (!ST.tripReal?'<div class="warn">These legs are <strong>example data</strong>, not your trip. Tap a leg to change it, or start from scratch below. Each leg sets the kit — and so the sessions — for its days.</div>':'')+
    (TRIP.length?'':'<div class="note">No legs yet. Days outside any leg are treated as full gym.</div>')+
    TRIP.map((seg,i)=>{ const c=CONTEXTS[seg.ctx]||CONTEXTS.full_gym,f=parseD(seg.from),open=!seg.to,t=open?null:parseD(seg.to);
      const isNow=inSpan(now,seg.from,legTo(seg)), wks=open?0:Math.max(1,Math.round((t-f)/(7*864e5)));
      const prev=TRIP[i-1], gap=prev&&prev.to?daysBetween(parseD(prev.to),f)-1:0;
      return (gap>0?'<div class="ex-note" style="text-align:center;margin:-2px 0 9px;">'+gap+(gap===1?' day':' days')+' between legs — treated as full gym</div>':'')+
        '<div class="seg'+(isNow?' now':'')+'" onclick="openLeg('+i+')" style="cursor:pointer;"><div class="seg-top"><div style="min-width:0;">'+
        '<div class="seg-place">'+esc(seg.place)+(isNow?' <span class="pin">now</span>':'')+'</div>'+
        '<div class="seg-when">'+f.getDate()+' '+MONTHS[f.getMonth()]+' – '+(open?'until you move on':t.getDate()+' '+MONTHS[t.getMonth()]+' '+t.getFullYear()+' · '+wks+' wks')+' · '+BLOCK_TYPES[c.block].label+
          (seg.lifts||(seg.runs!==undefined&&seg.runs!=='')?' · '+(seg.lifts||'auto')+' lifts, '+(seg.runs!==undefined&&seg.runs!==''?seg.runs:'auto')+' runs':'')+
          (seg.third&&SESSIONS[seg.third]?' · 3rd: '+esc(SESSIONS[seg.third].label):'')+
          (seg.missing&&seg.missing.length?' · no '+esc(seg.missing.map(k=>KIT[k].toLowerCase()).join(', ')):'')+'</div></div>'+
        '<div class="seg-badge" style="background:'+c.bg+';color:'+c.color+';">'+c.icon+' '+esc(c.short)+'</div></div>'+
        (seg.focus?'<div class="seg-focus">'+esc(seg.focus)+'</div>':'')+'</div>'; }).join('')+
    '<button class="btn btn-p" style="margin-top:6px;" onclick="openLeg(-1)">+ Add a leg</button>'+
    (TRIP.length?'<button class="btn btn-g" style="margin-top:8px;" onclick="clearTrip()">Start the trip from scratch</button>':'');
}
function renderProgress(){
  PROG_NAMES=[];
  const tap=n=>{ PROG_NAMES.push(n); return ' onclick="openLift('+(PROG_NAMES.length-1)+')" style="cursor:pointer;"'; };
  const lifts=ANCHORS.map(k=>{
    const canon=ANCHOR_CANON[k], pts=anchorSeries(k).map(p=>p.v);
    let rows=pts.length
      ? '<div class="mrow"'+tap(canon)+'><div style="flex-shrink:0;">'+spark(pts,56,26,false,'var(--green)')+'</div>'+
        '<div class="m-l"><div class="m-n">'+esc(canon)+'</div>'+
        '<div class="m-s">'+pts.length+(pts.length===1?' session':' sessions')+' · est. 1RM</div></div>'+
        '<div class="m-v"><div class="m-val">'+pts[pts.length-1]+'kg</div>'+
        '<div class="m-d">'+(pts.length>1?delta(pts[pts.length-1],pts[0],'kg'):'')+'</div></div></div>'
      : '<div class="mrow"><div class="m-l"><div class="m-n">'+esc(canon)+'</div>'+
        '<div class="m-s">No logged history yet</div></div><div class="m-v"><div class="m-val dim">—</div></div></div>';
    patternNames(k).forEach(n=>{
      if(n===canon)return;
      const vp=exSeries(n).map(p=>p.v), lg=lastExLog(n);
      if(!lg)return;
      rows+=vp.length
        ? '<div class="mrow var"'+tap(n)+'><div style="flex-shrink:0;">'+spark(vp,56,22,false,'var(--ink3)')+'</div>'+
          '<div class="m-l"><div class="m-n">'+esc(n)+'</div>'+
          '<div class="m-s">'+vp.length+(vp.length===1?' session':' sessions')+' · its own line</div></div>'+
          '<div class="m-v"><div class="m-val" style="font-size:17px;">'+vp[vp.length-1]+'kg</div>'+
          '<div class="m-d">'+(vp.length>1?delta(vp[vp.length-1],vp[0],'kg'):'')+'</div></div></div>'
        : '<div class="mrow var"'+tap(n)+'><div class="m-l"><div class="m-n">'+esc(n)+'</div>'+
          '<div class="m-s">'+esc(setsSummary(lg.sets))+' · '+dShort(lg.date)+'</div></div>'+
          '<div class="m-v"><div class="m-val dim" style="font-size:15px;">no load</div></div></div>';
    });
    return rows; }).join('');
  const rs=runSeries(), km=rs.map(r=>r.km), pc=rs.filter(r=>r.pace>0).map(r=>r.pace);
  const runs=rs.length
    ? '<div class="mrow"><div style="flex-shrink:0;">'+spark(km,56,26,false,'var(--accent)')+'</div>'+
      '<div class="m-l"><div class="m-n">Weekly volume</div><div class="m-s">'+rs.length+' weeks</div></div>'+
      '<div class="m-v"><div class="m-val">'+km[km.length-1]+'km</div><div class="m-d">'+(km.length>1?delta(km[km.length-1],km[0],'km'):'')+'</div></div></div>'+
      (pc.length?'<div class="mrow"><div style="flex-shrink:0;">'+spark(pc,56,26,true,'var(--accent)')+'</div>'+
      '<div class="m-l"><div class="m-n">Average pace</div><div class="m-s">Lower is better</div></div>'+
      '<div class="m-v"><div class="m-val">'+paceStr(pc[pc.length-1])+'</div><div class="m-d">'+(pc.length>1?delta(pc[pc.length-1],pc[0],'pace',true):'')+'</div></div></div>':'')
    : '<div class="ex-note">No runs logged yet.</div>';
  const bs=benchSeries(), bv=bs.map(benchScore), bl=bs[bs.length-1];
  const bench=(bv.length
    ? '<div class="mrow"><div style="flex-shrink:0;">'+spark(bv,56,26,false,'var(--purple)')+'</div>'+
      '<div class="m-l"><div class="m-n">12-min AMRAP</div><div class="m-s">10 push-ups · 15 air squats · 10 burpees</div></div>'+
      '<div class="m-v"><div class="m-val">'+benchTxt(bl)+'</div><div class="m-d">'+(bv.length>1?delta(bv[bv.length-1],bv[0],' rds'):'')+'</div></div></div>'+
      bs.slice().reverse().map(b=>'<div class="mrow var"><div class="m-l"><div class="m-n">'+dShort(b.date)+' — '+benchTxt(b)+' rounds</div>'+
        (b.notes?'<div class="m-s">'+esc(b.notes)+'</div>':'')+'</div>'+
        '<button class="lgx" onclick="deleteBench(\''+esc(b.date)+'\')">✕</button></div>').join('')
    : '<div class="ex-note">Not tested yet. 12 minutes, no equipment — 10 push-ups, 15 air squats, 10 burpees.</div>')+
    (benchDue()&&bv.length?'<div class="warn" style="margin:12px 0 0;">Due — last test was '+dShort(bl.date)+'.</div>':'')+
    '<button class="btn btn-p" style="margin-top:12px;" onclick="openBench()">Log a test</button>';
  const ergKeys=['row1k','row2k','skiErg1k','skiErg2k'];
  const ergLabels={row1k:'Row 1k',row2k:'Row 2k',skiErg1k:'Ski erg 1k',skiErg2k:'Ski erg 2k'};
  const ergRows=ergKeys.map(k=>{ const v=ST.ergPRs[k];
    return '<div class="mrow"><div class="m-l"><div class="m-n">'+ergLabels[k]+'</div>'+
      '<div class="m-s">'+(v?'Imported from v1 — kept as history':'Never tested')+'</div></div>'+
      '<div class="m-v"><div class="m-val'+(v?' dim':' dim')+'">'+esc(v||'—')+'</div></div></div>'; }).join('');
  const imported=ST.importedCounts;
  ENTRIES=recentEntries(10);
  const recent=ENTRIES.length
    ? ENTRIES.map((e,i)=>'<div class="mrow" onclick="openEntry('+i+')" style="cursor:pointer;"><div class="m-l">'+
        '<div class="m-n">'+esc(entryLabel(e))+(e.kind==='lift'&&!e.ref.sid?' <span class="tagmini" style="background:var(--cream2);color:var(--ink3);">v1</span>':'')+'</div>'+
        '<div class="m-s">'+esc(entryLine(e))+'</div></div>'+
        '<div class="m-v"><div style="font-size:11px;font-weight:700;color:var(--ink3);">'+dShort(e.date)+'</div></div></div>').join('')
    : '<div class="ex-note">Nothing logged yet.</div>';
  document.getElementById('pg-bench').innerHTML=
    consistencyCard()+bodyCard()+
    (imported?'<div class="note">Imported from your v1 app: '+imported.lifts+' lift sessions and '+imported.runs+' runs. v1 was read once and is never written to.</div>':'')+
    '<div class="card-lg"><div class="chd"><div><div class="ctitle">Strength — the four anchors</div>'+
      '<div class="sub">One headline lift per pattern, fixed for the whole trip. Travel variants sit indented on their own lines — mixing a goblet squat into your back squat trend would make it saw up and down as you move and tell you nothing. Tap any lift for its full history.</div></div></div>'+lifts+'</div>'+
    '<div class="card-lg"><div class="chd"><div><div class="ctitle">Running</div>'+
      '<div class="sub">Volume and pace, week by week</div></div></div>'+runs+'</div>'+
    '<div class="card-lg"><div class="chd"><div><div class="ctitle">Travel-proof benchmark</div>'+
      '<div class="sub">Re-tested every block · needs no equipment</div></div></div>'+bench+'</div>'+
    '<div class="card-lg"><div class="chd"><div><div class="ctitle">Erg benchmarks</div>'+
      '<div class="sub">Rower and ski erg</div></div></div>'+
      '<div class="stale" style="margin-bottom:12px;">Kept as history while you have no rower. Split targets stay paused rather than being driven by numbers that no longer describe you.</div>'+
      ergRows+'</div>'+
    '<div class="card-lg"><div class="chd"><div><div class="ctitle">Recent</div>'+
      '<div class="sub">Last ten things you logged. Tap one for the detail.</div></div></div>'+recent+'</div>'+
    backupCard();
}
function nav(pg,btn,keepMove){
  if(!keepMove&&MOVE){ MOVE=null; }
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('pg-'+pg).classList.add('active');
  document.querySelectorAll('.ni').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); window.scrollTo(0,0);
  if(pg==='week')renderWeek();
}
function renderAll(){
  DAY_CTX=dayContexts();
  const ti=todayIdx();
  if(ti>=0)CTX=DAY_CTX[ti];
  const seg=currentSeg();
  document.getElementById('wkb').textContent='Block wk '+blockWeek()+' · '+(seg?seg.place:'Travelling')+' 📍';
  renderChips(); renderToday(); renderWeek(); renderTrip(); renderProgress();
}
try{ renderAll(); }catch(e){
  document.body.innerHTML='<div style="padding:40px;font-family:sans-serif;color:#221F20;">'+
    '<h2 style="margin-bottom:12px;">Startup error</h2><p style="margin-bottom:8px;">'+e.message+'</p>'+
    '<pre style="font-size:11px;color:#666;white-space:pre-wrap;">'+e.stack+'</pre></div>';
}
</script>
